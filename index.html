<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TirScore</title>
<meta name="description" content="Saisie des scores de tir et classement d'équipes pour l'EPS">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff4d1c">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TirScore">
<meta name="mobile-web-app-capable" content="yes">
<meta name="msapplication-TileImage" content="icon-256.png">
<meta name="msapplication-TileColor" content="#ff4d1c">
<style>

@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#f3f5f1;
  --surface:#ffffff;
  --surface-2:#edf1ea;
  --ink:#12181a;
  --ink-dim:#57655f;
  --border:#dbe2d8;
  --accent:#ff4d1c;
  --accent2:#0a6dff;
  --accent-ink:#ffffff;
  --accent-soft:#ffe2d4;
  --warn:#ffb200;
  --danger:#ef233c;
  --danger-soft:#ffdce1;
  --good:#0fb85c;
  --radius:14px;
  --shadow:0 1px 2px rgba(20,30,25,.07), 0 8px 22px -10px rgba(20,30,25,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1210;
    --surface:#171e1a;
    --surface-2:#1d2621;
    --ink:#f2f6f2;
    --ink-dim:#aab8b0;
    --border:#2c3831;
    --accent:#ff6a3d;
    --accent2:#4d94ff;
    --accent-ink:#1a0800;
    --accent-soft:#3d2013;
    --warn:#ffc94d;
    --danger:#ff6b7a;
    --danger-soft:#3c1a1f;
    --good:#3fe08a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 26px -10px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1210;
  --surface:#171e1a;
  --surface-2:#1d2621;
  --ink:#f2f6f2;
  --ink-dim:#aab8b0;
  --border:#2c3831;
  --accent:#ff6a3d;
  --accent2:#4d94ff;
  --accent-ink:#1a0800;
  --accent-soft:#3d2013;
  --warn:#ffc94d;
  --danger:#ff6b7a;
  --danger-soft:#3c1a1f;
  --good:#3fe08a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 26px -10px rgba(0,0,0,.65);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Manrope',system-ui,sans-serif;
  padding-inline:16px;
}
h1,h2,h3,.display{
  font-family:'Oswald',"Arial Narrow",sans-serif;
  text-transform:uppercase;
  letter-spacing:.02em;
  text-wrap:balance;
  margin:0;
}
#app{width:95%;max-width:2400px;margin:0 auto;padding-block:20px 48px;}
.stage{max-width:none;}
.stage .card{padding:16px 20px;}
.hidden{display:none!important;}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -16px 20px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--accent),var(--accent2),var(--good)) 1;}
.topbar-status{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-status strong{color:var(--ink);}
.mode-switch{display:inline-flex;gap:6px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);flex:0 0 auto;}
.mode-btn{font-family:'Oswald',"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:16px;font-weight:600;border:none;border-radius:10px;padding:10px 20px;min-height:46px;cursor:pointer;background:transparent;color:var(--ink-dim);display:inline-flex;align-items:center;gap:8px;}
.mode-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.mode-btn.eleve.active{background:var(--accent2);color:#fff;}
.mode-btn.prof.active{background:linear-gradient(135deg,var(--accent),#ff2d6b);color:#fff;}
.mode-btn:not(.active):hover{background:var(--surface-2);color:var(--ink);}
@media (max-width:640px){ .topbar-status{display:none;} .mode-btn{padding:10px 14px;font-size:15px;} .topbar .brand-logo{height:44px;} }
.brand{display:flex;align-items:baseline;gap:8px;}
.brand .logo-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;}
.brand-logo{height:58px;width:auto;border-radius:9px;display:block;}
.brand h1.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
.brand h1{font-size:20px;color:var(--ink);}
.brand .tag{font-family:'Manrope';text-transform:none;font-size:12px;color:var(--ink-dim);letter-spacing:0;}
.btn{
  font-family:'Manrope';font-weight:700;font-size:14px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:10px 16px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
.btn:hover{border-color:var(--accent);}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.btn.primary{background:linear-gradient(135deg,var(--accent),#ff2d6b);color:var(--accent-ink);border-color:transparent;box-shadow:0 4px 14px -4px rgba(255,77,28,.55);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-dim);}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent;}
.btn.big{padding:20px 22px;font-size:17px;border-radius:16px;min-height:64px;width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
.stack{display:flex;flex-direction:column;gap:14px;}
.grid{display:grid;gap:14px;}
.center{max-width:none;margin:0 auto;}
.muted{color:var(--ink-dim);font-size:14px;}
.eyebrow{font-family:'Oswald';text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--accent);font-weight:600;}

.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.team-swatch{
  border:none;border-radius:16px;padding:22px 12px;min-height:96px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:#fff;font-family:'Oswald';font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.03em;
  box-shadow:var(--shadow);
}
.team-swatch small{font-family:'Manrope';text-transform:none;font-weight:600;font-size:12px;opacity:.85;letter-spacing:0;}
.team-swatch:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}

.name-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.name-btn{
  border-radius:12px;border:2px solid var(--border);background:var(--surface);
  padding:16px 10px;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);
}
.name-btn:hover{border-color:var(--accent);}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;}
.chip.outline{background:transparent;border:1px solid var(--border);color:var(--ink-dim);font-weight:600;}
.chip.team-chip{font-family:'Oswald';font-size:22px;padding:12px 26px;text-transform:uppercase;letter-spacing:.03em;}

.serie-card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface-2);}
.serie-score{font-family:'Oswald';font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--good);}
.serie-empty{color:var(--ink-dim);font-size:14px;}

.slider-wrap{text-align:center;padding:14px 4px;}
.slider-value{font-family:'Oswald';font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;margin-bottom:18px;}
input[type=range]{width:100%;height:44px;accent-color:var(--accent);}
.slider-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-dim);margin-top:4px;}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:0;}
.tab-btn{background:transparent;border:none;border-bottom:2px solid transparent;padding:10px 4px;margin-right:14px;font-family:'Oswald';text-transform:uppercase;letter-spacing:.04em;font-size:13px;color:var(--ink-dim);cursor:pointer;}
.tab-btn.active{color:var(--ink);border-color:var(--accent);}

.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select{
  font-family:'Manrope';font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink);
}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.row>.field{flex:1;min-width:120px;}

table{border-collapse:collapse;width:100%;font-size:14px;}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;}
th{font-family:'Oswald';text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--ink-dim);}
.table-wrap{overflow-x:auto;}
tr.rank-1 td{background:var(--accent-soft);}

.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;}
.iconbtn{background:transparent;border:none;color:var(--ink-dim);cursor:pointer;font-size:16px;padding:4px 8px;border-radius:8px;}
.iconbtn:hover{color:var(--danger);background:var(--danger-soft);}

.banner{border-radius:12px;padding:12px 16px;font-size:14px;display:flex;gap:10px;align-items:center;}
.banner.info{background:var(--accent-soft);color:var(--ink);}
.banner.warn{background:var(--danger-soft);color:var(--ink);}

.empty{text-align:center;padding:40px 20px;color:var(--ink-dim);}

@media (max-width:520px){
  .slider-value{font-size:48px;}
  .row{flex-direction:column;align-items:stretch;}
}

.app-signature{
  position:fixed;right:10px;bottom:8px;
  font-family:'Manrope';font-size:11px;font-weight:600;
  color:var(--ink-dim);opacity:.6;letter-spacing:.02em;
  pointer-events:none;z-index:5;
}
.app-version{
  position:fixed;left:10px;bottom:8px;
  font-family:'Manrope';font-size:11px;font-weight:600;
  color:var(--ink-dim);opacity:.6;letter-spacing:.02em;
  pointer-events:none;z-index:5;
}

/* ---- navigation : boutons plus visibles avec flèches colorées ---- */
.btn-nav{
  font-family:'Manrope';font-weight:800;font-size:15px;
  border:2px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:12px;padding:10px 18px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
.btn-nav:hover{border-color:var(--accent);}
.btn-nav:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.nav-arrow{font-weight:900;font-size:1.3em;line-height:1;display:inline-block;}
.nav-arrow.back{color:var(--accent);}
.nav-arrow.fwd{color:var(--accent2);}
.btn-nav.fwd{border-color:var(--accent2);}

.match-side{flex:1;min-width:0;text-align:center;padding:6px;}
.match-side .players{font-weight:700;font-size:14px;line-height:1.5;}
.match-vs{font-family:'Oswald';font-weight:700;color:var(--ink-dim);padding:0 8px;}
.court-badge{display:inline-flex;align-items:center;gap:6px;font-family:'Oswald';font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-dim);background:var(--surface-2);border-radius:999px;padding:3px 10px;}

.timer-display{font-family:'Oswald';font-size:clamp(96px,24vw,280px);font-weight:700;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.02em;line-height:1;}
.timer-display.done{color:var(--danger);}
.timer-wrap{text-align:center;}
.timer-display.small{font-size:52px;}
.lock-note{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-dim);font-size:13px;font-weight:700;}

.absent-row{opacity:.55;}
.absent-row .chip.absent{background:var(--danger);}

.appel-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;}
.appel-grid .list-row{flex-wrap:wrap;}
@media (max-width:640px){
  .appel-grid{grid-template-columns:1fr;}
}

.toggle-btn{
  font-family:'Manrope';font-weight:700;font-size:12px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink-dim);
  border-radius:999px;padding:7px 12px;cursor:pointer;margin-top:6px;width:100%;
}
.toggle-btn.active{background:var(--good);border-color:var(--good);color:#fff;}

/* ---- v3 : séries configurables, résumé des leçons, terrains, super pouvoir ---- */
.stepper{display:inline-flex;align-items:center;gap:8px;}
.stepper .btn{min-width:48px;min-height:44px;font-size:20px;font-weight:800;padding:6px 12px;}
.stepper .btn[disabled]{opacity:.4;cursor:default;}
.stepper-val{font-family:'Oswald';font-size:22px;font-weight:700;min-width:64px;text-align:center;font-variant-numeric:tabular-nums;}
.serie-edit{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);}
.serie-edit .field{min-width:0;}
.lesson-row{padding:10px 0;border-bottom:1px solid var(--border);}
.lesson-row:last-child{border-bottom:none;}
.lesson-plan{display:flex;flex-direction:column;gap:4px;margin-top:8px;padding-left:4px;}
.lesson-plan-item{display:flex;align-items:center;gap:8px;font-size:14px;}
.lesson-plan-item.power{color:var(--accent);font-weight:700;}
.lesson-plan-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--ink);font-size:12px;font-weight:800;flex:0 0 auto;}
.court-badge.big{font-size:20px;padding:8px 20px;color:var(--ink);background:var(--accent-soft);border:2px solid var(--accent);}
.power-counter{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding:6px 8px;border-radius:12px;background:var(--accent-soft);}
.power-counter .lbl{font-weight:700;font-size:13px;}
.power-counter .btn{min-width:44px;min-height:40px;font-size:18px;font-weight:800;padding:4px 10px;}
.power-counter .val{font-family:'Oswald';font-size:20px;font-weight:700;min-width:28px;text-align:center;}
.court-grid td,.court-grid th{text-align:center;}
.court-grid td:first-child,.court-grid th:first-child{text-align:left;}
.rank-evo{font-size:12px;font-weight:800;}
.rank-evo.up{color:var(--good);}
.rank-evo.down{color:var(--danger);}
.timeout-box{border:3px solid var(--warn);border-radius:var(--radius);padding:14px;background:color-mix(in srgb,var(--warn) 12%,var(--surface));display:flex;flex-direction:column;align-items:center;gap:8px;}
.timer-display.timeout{color:var(--warn);}
.timeout-btn{border:2px solid var(--warn);font-weight:800;min-height:48px;padding:10px 22px;}

</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand" data-action="go-eleve" style="cursor:pointer" title="Espace élève">
      <img src="logo.png" alt="Basket N'EPS" class="brand-logo">
      <h1 class="sr-only">TirScore</h1>
    </div>
    <div class="topbar-status" id="topbar-status"></div>
    <div class="mode-switch" id="topbar-actions" role="navigation" aria-label="Espace"></div>
  </div>
  <div id="screen"><div class="empty">Chargement…</div></div>
</div>
<div class="app-version" id="app-version"></div>
<div class="app-signature">By Hugo Bredin &amp; Quentin Delisle</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';

var TEAM_COLORS = [
  {id:'noir', label:'Noir', hex:'#1c1d1f', text:'#ffffff'},
  {id:'rouge', label:'Rouge', hex:'#df3b3f', text:'#ffffff'},
  {id:'vert', label:'Vert', hex:'#2f9e44', text:'#ffffff'},
  {id:'jaune', label:'Jaune', hex:'#f0c419', text:'#1c1d1f'},
  {id:'bleu-fonce', label:'Bleu foncé', hex:'#173d8c', text:'#ffffff'},
  {id:'bleu-ciel', label:'Bleu ciel', hex:'#5bc0e8', text:'#0c2733'},
  {id:'orange', label:'Orange', hex:'#e0710c', text:'#ffffff'},
  {id:'blanc', label:'Blanc', hex:'#ffffff', text:'#1c1d1f', border:true},
  {id:'violet', label:'Violet', hex:'#8b5cf6', text:'#ffffff'}
];
function swatchStyle(c){
  var text = c.text || '#ffffff';
  var border = c.border ? 'border:2px solid var(--ink-dim);' : '';
  return 'background:'+c.hex+';color:'+text+';'+border;
}

// Numéro de version affiché en bas à gauche de l'écran, à incrémenter à
// chaque nouvelle mise à jour de l'application.
var APP_VERSION = 'v3.1';
(function(){
  var el = document.getElementById('app-version');
  if (el) el.textContent = APP_VERSION;
})();

var state = {
  db: null,
  dbReady: false,
  view: 'eleve-home',
  classes: [],
  config: {activeClassId:null, activeSeanceId:null},
  subscribedClassId: null,
  teams: [],
  students: [],
  seances: [],
  tirs: [],
  matches: [],
  absences: [],
  adminClassId: null,
  adminTab: 'equipes',
  profUnlocked: false,
  student: {teamId:null, studentId:null},
  saisieSerie: null,
  saisieValue: 0,
  msg: null,
  profSeanceFilter: null,
  classementScope: 'all',
  classementResult: null,
  classementTirScope: 'all',
  classementTirResult: null,
  classementGeneralScope: 'all',
  classementGeneralResult: null,
  matchForm: {seanceId:null, teamA:null, teamB:null, scoreA:0, scoreB:0, scorersA:false, scorersB:false, editingId:null},
  tournamentForm: {seanceId:null, courts:null},
  seanceForm: null,
  roundEntry: {},
  roundTimer: {duration:480, remaining:480, running:false, ended:false, halfBeeped:false, forRound:null},
  timeout: {active:false, remaining:0, resumeAfter:false},
  eleveMatchMsg: null
};

var unsubs = {};
var roundTimerHandle = null;
function watch(key, colPath, cb){
  if (unsubs[key]) { unsubs[key](); delete unsubs[key]; }
  if (!colPath || !state.db) { cb([]); return; }
  try{
    unsubs[key] = state.db.collection(colPath).onSnapshot(
      function(snap){
        var list = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        cb(list);
      },
      function(err){ console.error('watch', key, err); }
    );
  }catch(e){ console.error('watch build', key, e); cb([]); }
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtNum(v){
  var num = Number(v);
  var dec = (num % 1 !== 0) ? 1 : 0;
  return num.toFixed(dec).replace('.', ',');
}
function colorOf(colorId){
  return TEAM_COLORS.find(function(c){return c.id===colorId;}) || {label:colorId, hex:'#888'};
}
function teamById(id){ return state.teams.find(function(t){return t.id===id;}); }
// Couleur affichée pour une équipe : l'équipe garde son identité (élèves,
// matchs, résultats) même quand sa couleur change. teamOrId accepte soit un
// objet équipe, soit un id d'équipe (on va alors le chercher).
function colorForTeam(teamOrId){
  var t = (teamOrId && typeof teamOrId === 'object') ? teamOrId : teamById(teamOrId);
  if (!t) return colorOf(teamOrId);
  return colorOf(t.color || t.id);
}
function usedColorIds(excludeTeamId){
  return state.teams.filter(function(t){ return t.id !== excludeTeamId; }).map(function(t){ return t.color || t.id; });
}
function studentById(id){ return state.students.find(function(s){return s.id===id;}); }
function seanceById(id){ return state.seances.find(function(s){return s.id===id;}); }
function activeSeance(){ return seanceById(state.config.activeSeanceId); }
function activeClass(){ return state.classes.find(function(c){return c.id===state.config.activeClassId;}); }
function studentsOfTeam(teamId){ return state.students.filter(function(s){return s.teamId===teamId;}); }

// ---- séries de tir configurables par leçon ----
// Une leçon récente porte un tableau `series` : [{name, shots, value}]
// (nom de l'exercice, nombre de tirs, points par tir réussi). Les anciennes
// leçons (sans `series`) gardent leur fonctionnement d'origine : 2 séries,
// curseur tirMin..tirMax, 1 point par unité.
function seanceSeries(sea){
  if (sea && Array.isArray(sea.series) && sea.series.length){
    return sea.series.map(function(s, i){
      return {
        name: (s.name && String(s.name).trim()) || ('Série '+(i+1)),
        shots: Math.max(1, parseInt(s.shots, 10) || 10),
        value: Math.max(1, parseInt(s.value, 10) || 1),
        min: 0
      };
    });
  }
  var max = sea && sea.tirMax != null ? Math.round(sea.tirMax) : 10;
  var min = sea && sea.tirMin != null ? Math.round(sea.tirMin) : 0;
  return [{name:'Série 1', shots:max, value:1, min:min, legacy:true}, {name:'Série 2', shots:max, value:1, min:min, legacy:true}];
}
function ptsLabel(v){ return v + ' pt' + (v > 1 ? 's' : ''); }
function serieSummary(s){
  return s.legacy ? (esc(s.name)+' · curseur '+s.min+' à '+s.shots)
    : (esc(s.name)+' · '+s.shots+' tirs × '+ptsLabel(s.value)+' <span class="muted">(max '+(s.shots*s.value)+')</span>');
}
// Points d'une série (index n à partir de 1) pour un résultat de tir. Les
// tirs réussis (madeN) sont stockés et les points recalculés avec la valeur
// actuelle de la série : modifier la valeur d'une série après coup met à jour
// les classements. Les anciens résultats (serieN seul) sont repris tels quels.
function tirSeriePoints(tir, sea, n){
  if (!tir) return null;
  var series = seanceSeries(sea);
  var s = series[n-1];
  if (tir['made'+n] != null && s) return tir['made'+n] * s.value;
  if (tir['serie'+n] != null) return tir['serie'+n];
  return null;
}
function tirAllPoints(tir){
  var sea = seanceById(tir.seanceId);
  var count = Math.max(seanceSeries(sea).length, 2);
  Object.keys(tir).forEach(function(k){ var m = /^(?:serie|made)(\d+)$/.exec(k); if (m) count = Math.max(count, parseInt(m[1],10)); });
  var vals = [];
  for (var n = 1; n <= count; n++){ var p = tirSeriePoints(tir, sea, n); if (p != null) vals.push(p); }
  return vals;
}

// ---- super pouvoir (par leçon) ----
function seancePower(sea){
  if (!sea || !sea.powerName || !String(sea.powerName).trim()) return null;
  return {name: String(sea.powerName).trim(), bonus: sea.powerBonus != null && !isNaN(sea.powerBonus) ? Number(sea.powerBonus) : 2};
}

// ---- leçons dans l'ordre chronologique (date, puis création) ----
function seancesChrono(){
  return state.seances.slice().sort(function(a, b){
    var da = a.date || '', dbb = b.date || '';
    if (da !== dbb) return da < dbb ? -1 : 1;
    return (a.createdAt||0) - (b.createdAt||0);
  });
}
// Portée d'un classement : 'all' (tout le cycle), 'upto:<id>' (cumul à
// l'issue de cette leçon), 'only:<id>' (cette leçon seule). Renvoie la liste
// des ids de leçons concernées, ou null pour « toutes ».
function resolveScope(scope){
  if (!scope || scope === 'all') return null;
  var chrono = seancesChrono();
  var parts = scope.split(':');
  var kind = parts.length > 1 ? parts[0] : 'only';
  var id = parts.length > 1 ? parts[1] : parts[0];
  if (kind === 'upto'){
    var idx = chrono.findIndex(function(s){ return s.id === id; });
    if (idx === -1) return [];
    return chrono.slice(0, idx+1).map(function(s){ return s.id; });
  }
  return [id];
}
// Portée « cumul à l'issue de la leçon précédente » (pour l'évolution du rang)
function previousScopeIds(scope){
  if (scope && scope.indexOf('only:') === 0) return null;
  var ids = resolveScope(scope);
  var chrono = seancesChrono().map(function(s){ return s.id; });
  if (ids === null) ids = chrono.slice();
  if (ids.length < 2) return null;
  return ids.slice(0, ids.length - 1);
}
function scopeOptionsHtml(current, allLabel){
  var chrono = seancesChrono();
  var sel = function(v){ return current === v ? ' selected' : ''; };
  var html = '<option value="all"'+sel('all')+'>'+esc(allLabel || 'Tout le cycle (toutes les leçons)')+'</option>';
  if (chrono.length){
    html += '<optgroup label="Cumul à l\'issue de la leçon…">' + chrono.map(function(s, i){
      return '<option value="upto:'+s.id+'"'+sel('upto:'+s.id)+'>À l\'issue de la leçon '+(i+1)+' — '+esc(s.label)+'</option>';
    }).join('') + '</optgroup>';
    html += '<optgroup label="Une seule leçon">' + chrono.map(function(s, i){
      return '<option value="only:'+s.id+'"'+(sel('only:'+s.id)||sel(s.id))+'>Leçon '+(i+1)+' seule — '+esc(s.label)+'</option>';
    }).join('') + '</optgroup>';
  }
  return html;
}
function scopeIncludes(ids, seanceId){ return !ids || ids.indexOf(seanceId) !== -1; }

// Remet à zéro tout ce qui est calculé/filtré pour une classe précise
// (classements déjà calculés, filtres, formulaires de match) : évite qu'un
// classement ou un filtre d'une autre classe reste affiché après avoir
// changé de classe en cours.
function resetClassScopedUI(){
  state.profSeanceFilter = null;
  state.classementScope = 'all';
  state.classementResult = null;
  state.classementTirScope = 'all';
  state.classementTirResult = null;
  state.classementGeneralScope = 'all';
  state.classementGeneralResult = null;

  state.tournamentForm = {seanceId:null, courts: state.tournamentForm ? state.tournamentForm.courts : null};
  state.seanceForm = null;
  state.roundEntry = {};
}
function ensureClassSubscribed(classId){
  if (state.subscribedClassId === classId) return;
  state.subscribedClassId = classId;
  resetClassScopedUI();
  if (!classId){
    watch('teams', null, function(l){ state.teams=l; render(); });
    watch('students', null, function(l){ state.students=l; render(); });
    watch('seances', null, function(l){ state.seances=l; render(); });
    watch('tirs', null, function(l){ state.tirs=l; render(); });
    watch('matches', null, function(l){ state.matches=l; render(); });
    watch('absences', null, function(l){ state.absences=l; render(); });
    return;
  }
  watch('teams', 'classes/'+classId+'/teams', function(l){ state.teams=l; render(); });
  watch('students', 'classes/'+classId+'/students', function(l){ state.students=l; render(); });
  watch('seances', 'classes/'+classId+'/seances', function(l){ state.seances=l; render(); });
  watch('tirs', 'classes/'+classId+'/tirs', function(l){ state.tirs=l; render(); });
  watch('matches', 'classes/'+classId+'/matches', function(l){ state.matches=l; render(); });
  watch('absences', 'classes/'+classId+'/absences', function(l){ state.absences=l; render(); });
}
function isAbsent(seanceId, studentId){
  return state.absences.some(function(a){ return a.seanceId===seanceId && a.studentId===studentId; });
}

// ---------- stockage local (hors Claude : GitHub Pages, usage hors-ligne) ----------
// Implémente le même sous-ensemble d'API que la capability "db" de Claude
// (doc/collection/get/set/update/delete/onSnapshot/where), mais persiste
// dans localStorage sur l'appareil. Utilisé automatiquement quand l'app
// tourne en dehors d'un artifact Claude (window.claude absent).
function LocalDb(){
  var STORAGE_KEY = 'tirscore-data-v1';
  var store = {};
  var listeners = {};

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) store = JSON.parse(raw) || {};
    }catch(e){ console.error('LocalDb load', e); store = {}; }
  }
  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }catch(e){ console.error('LocalDb persist', e); }
  }
  load();

  function collectionDocs(colPath){
    var col = store[colPath] || {};
    return Object.keys(col).map(function(id){ return {id:id, data:col[id]}; });
  }
  function makeSnapshot(id, data){
    return {
      id:id, exists: data !== undefined,
      data: function(){ return data; },
      metadata:{fromCache:false, hasPendingWrites:false}
    };
  }
  function notifyCollection(colPath){
    (listeners[colPath] || []).forEach(function(cb){ cb(collectionDocs(colPath)); });
  }
  function notifyDoc(colPath, id){
    var key = colPath+'::doc::'+id;
    (listeners[key] || []).forEach(function(cb){ cb(); });
  }

  function docRef(path){
    var parts = path.split('/').filter(Boolean);
    var id = parts[parts.length-1];
    var colPath = parts.slice(0,-1).join('/');
    return {
      id:id, path:path,
      get: function(){
        var col = store[colPath] || {};
        return Promise.resolve(makeSnapshot(id, col[id]));
      },
      set: function(data){
        if (!store[colPath]) store[colPath] = {};
        store[colPath][id] = JSON.parse(JSON.stringify(data));
        persist(); notifyCollection(colPath); notifyDoc(colPath, id);
        return Promise.resolve();
      },
      update: function(data){
        if (!store[colPath] || store[colPath][id] === undefined){
          return Promise.reject({code:'invalid_argument', message:'Document introuvable'});
        }
        Object.assign(store[colPath][id], JSON.parse(JSON.stringify(data)));
        persist(); notifyCollection(colPath); notifyDoc(colPath, id);
        return Promise.resolve();
      },
      delete: function(){
        if (store[colPath]) delete store[colPath][id];
        persist(); notifyCollection(colPath); notifyDoc(colPath, id);
        return Promise.resolve();
      },
      onSnapshot: function(next){
        var key = colPath+'::doc::'+id;
        if (!listeners[key]) listeners[key] = [];
        var cb = function(){
          var col = store[colPath] || {};
          next(makeSnapshot(id, col[id]));
        };
        listeners[key].push(cb);
        cb();
        return function(){
          var arr = listeners[key]; var i = arr.indexOf(cb);
          if (i>-1) arr.splice(i,1);
        };
      }
    };
  }

  function queryRef(colPath, filters){
    filters = filters || [];
    function applyFilters(raw){
      return raw.filter(function(d){
        return filters.every(function(f){
          var v = d.data ? d.data[f.field] : undefined;
          return f.op === '==' ? v === f.value : true;
        });
      });
    }
    return {
      path: colPath,
      where: function(field, op, value){ return queryRef(colPath, filters.concat([{field:field, op:op, value:value}])); },
      get: function(){
        var docsOut = applyFilters(collectionDocs(colPath)).map(function(d){ return makeSnapshot(d.id, d.data); });
        return Promise.resolve({docs:docsOut, size:docsOut.length, empty:docsOut.length===0});
      },
      onSnapshot: function(next){
        var cb = function(raw){
          var docsOut = applyFilters(raw).map(function(d){ return makeSnapshot(d.id, d.data); });
          next({docs:docsOut, size:docsOut.length, empty:docsOut.length===0, docChanges:function(){return [];}});
        };
        if (!listeners[colPath]) listeners[colPath] = [];
        listeners[colPath].push(cb);
        cb(collectionDocs(colPath));
        return function(){
          var arr = listeners[colPath]; var i = arr.indexOf(cb);
          if (i>-1) arr.splice(i,1);
        };
      },
      doc: function(id){
        id = id || genId();
        return docRef(colPath+'/'+id);
      },
      add: function(data){
        var ref = docRef(colPath+'/'+genId());
        return ref.set(data).then(function(){ return ref; });
      }
    };
  }

  return {
    doc: function(path){ return docRef(path); },
    collection: function(path){ return queryRef(path, []); }
  };
}

// Équivalent local du téléchargement (capability "downloads" de Claude) :
// déclenche un téléchargement de fichier classique dans le navigateur.
var localDownloads = {
  save: function(req){
    return new Promise(function(resolve, reject){
      try{
        var blob = req.data instanceof Blob ? req.data : new Blob([req.data], {type:'application/octet-stream'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = req.filename || 'export';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        resolve({status:'saved'});
      }catch(e){ reject(e); }
    });
  }
};
function getDb(){
  if (window.claude && window.claude.use){
    return window.claude.use('db').then(function(db){ return db || new LocalDb(); }).catch(function(){ return new LocalDb(); });
  }
  return Promise.resolve(new LocalDb());
}
function getDownloads(){
  if (window.claude && window.claude.use){
    return window.claude.use('downloads').then(function(d){ return d || localDownloads; }).catch(function(){ return localDownloads; });
  }
  return Promise.resolve(localDownloads);
}

// ---------- init ----------
function init(){
  render();
  getDb().then(function(db){
    state.db = db;
    state.dbReady = true;
    db.doc('app/config').onSnapshot(function(snap){
      state.config = snap.exists ? Object.assign({activeClassId:null, activeSeanceId:null}, snap.data()) : {activeClassId:null, activeSeanceId:null};
      render();
    }, function(err){ console.error('config', err); });
    db.collection('classes').onSnapshot(function(snap){
      state.classes = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(err){ console.error('classes', err); });
    render();
  });
}

function renderEleveFiche(){
  var sea = activeSeance();

    return '<div class="card empty">Leçon ou élève introuvable.</div>';

  var tir = tirFor(sea.id, stu.id);
  var series = seanceSeries(sea);
  function serieBlock(s, n){
    var pts = tirSeriePoints(tir, sea, n);
    var info = s.legacy ? '' : '<div class="serie-empty">'+s.shots+' tirs · '+ptsLabel(s.value)+' par tir réussi</div>';
    if (pts != null){
      var made = tir['made'+n];

    }
    return '<div class="serie-card"><div><strong>'+esc(s.name)+'</strong>'+info+'<div class="serie-empty">Pas encore saisie</div></div>'+
      '<button class="btn primary" data-action="start-saisie" data-serie="'+n+'">Saisir</button></div>';
  }
  var totalPts = tir ? tirAllPoints(tir).reduce(function(a,b){return a+b;},0) : 0;
  var teammates = studentsOfTeam(state.student.teamId).filter(function(s){
    return s.id !== stu.id && !isAbsent(sea.id, s.id);
  });
  var teammatesHtml = teammates.length ? (
    '<div class="eyebrow">Autres élèves de cette équipe</div>' +
    '<div class="name-grid">' +
      teammates.map(function(s){
        return '<button class="name-btn" data-action="pick-student" data-id="'+s.id+'">'+esc(s.firstName)+'</button>';
      }).join('') +
    '</div>'
  ) : '';
  return (
    '<div class="stack center">' +
      '<div class="chip" style="'+swatchStyle(c)+'">'+esc(c.label)+'</div>' +
      '<h2>'+esc(stu.firstName)+'</h2>' +
      '<p class="muted">'+esc(sea.label)+' — '+series.length+' série'+(series.length>1?'s':'')+' de tirs'+(tir ? ' · total : <strong>'+fmtNum(totalPts)+' pts</strong>' : '')+'</p>' +
      series.map(function(s, i){ return serieBlock(s, i+1); }).join('') +
      teammatesHtml +
      '<button class="btn-nav" data-action="go-eleve-precision"><span class="nav-arrow back">&larr;</span>Changer d\'équipe</button>' +
    '</div>'
  );
}

      (locked ? '' : (
        '<div class="row">' +
          '<div class="field slider-field">' +
            '<label>Score '+esc(ca.label)+' — <span id="rd-scoreA-disp-'+m.id+'">'+Math.round(entry.scoreA)+'</span></label>' +
            '<input type="range" class="rd-score" data-side="A" data-id="'+m.id+'" min="0" max="'+maxScore+'" step="1" value="'+Math.round(entry.scoreA)+'">' +

          '</div>' +
          '<div class="field slider-field">' +
            '<label>Score '+esc(cb.label)+' — <span id="rd-scoreB-disp-'+m.id+'">'+Math.round(entry.scoreB)+'</span></label>' +
            '<input type="range" class="rd-score" data-side="B" data-id="'+m.id+'" min="0" max="'+maxScore+'" step="1" value="'+Math.round(entry.scoreB)+'">' +
            '<button class="toggle-btn'+(entry.scorersB?' active':'')+'" data-action="toggle-scorers3" data-side="B" data-id="'+m.id+'">'+(entry.scorersB?'✓ ':'')+'3 marqueurs différents ('+esc(cb.label)+')</button>' +
            powerCounterHtml(power, entry.powerB||0, 'round-power', 'B', m.id, cb.label) +

      (power ? '<div class="banner info">⚡ Super pouvoir de la leçon : <strong>'+esc(power.name)+'</strong> — +'+ptsLabel(power.bonus)+' au classement à chaque utilisation.</div>' : '') +
      renderTimerCard(true, true) +
      matchesHtml +
      (locked ?
        '<p class="lock-note">🔒 La saisie des scores s\'ouvre à la fin du temps (ou en cliquant sur « Fin »).</p>'

    '</div>'
  );
}

// Formulaire « nouvelle leçon » : pré-rempli avec les séries et le super
// pouvoir de la dernière leçon créée (on garde souvent le même dispositif).
function newSeanceForm(){
  var today = new Date().toISOString().slice(0,10);
  var last = state.seances.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); })[0];
  var series = last ? seanceSeries(last).map(function(s){ return {name: s.legacy ? s.name : s.name, shots: s.shots, value: s.value}; })
    : [{name:'Série 1', shots:10, value:1}, {name:'Série 2', shots:10, value:1}];
  return {
    editingId: null, label: '', date: today, series: series,
    powerName: last && last.powerName ? last.powerName : '',
    powerBonus: last && last.powerBonus != null ? last.powerBonus : 2
  };
}
function seanceFormFrom(sea){
  return {
    editingId: sea.id, label: sea.label || '', date: sea.date || '',
    series: seanceSeries(sea).map(function(s){ return {name:s.name, shots:s.shots, value:s.value}; }),
    powerName: sea.powerName || '', powerBonus: sea.powerBonus != null ? sea.powerBonus : 2
  };
}
function seanceSummaryHtml(s){
  var series = seanceSeries(s);
  var total = series.reduce(function(a, x){ return a + (x.legacy ? 0 : x.shots * x.value); }, 0);
  var p = seancePower(s);
  return '<div class="lesson-plan">' +
    series.map(function(x, i){ return '<div class="lesson-plan-item"><span class="lesson-plan-num">'+(i+1)+'</span>'+serieSummary(x)+'</div>'; }).join('') +
    (total ? '<div class="muted" style="font-size:12px">Total possible en précision : '+total+' pts par élève</div>' : '') +
    (p ? '<div class="lesson-plan-item power"><span class="lesson-plan-num">⚡</span>Super pouvoir « '+esc(p.name)+' » · +'+ptsLabel(p.bonus)+' par utilisation</div>' : '') +
  '</div>';
}

    '<div class="row">' +
      '<div class="field"><label>Intitulé</label><input data-sf="label" value="'+esc(f.label)+'" placeholder="ex. Leçon du '+esc(f.date||'')+'"></div>' +

      '<div class="field" style="flex:2"><label>⚡ Super pouvoir du tournoi (thème, facultatif)</label><input data-sf="powerName" value="'+esc(f.powerName)+'" placeholder="ex. Passe dans le dos, panier en course…"></div>' +
      '<div class="field" style="flex:0 0 150px"><label>Bonus par utilisation</label><input type="number" min="1" step="1" data-sf="powerBonus" value="'+esc(f.powerBonus)+'"></div>' +

function currentRoundMatches(){
  var seaId = state.config.activeSeanceId;
  if (!seaId) return null;
  var scheduled = state.matches.filter(function(m){ return m.seanceId===seaId && m.scoreA == null; });
  if (!scheduled.length) return null;
  var minRound = scheduled.reduce(function(min,m){ var r=m.round||1; return r<min?r:min; }, Infinity);

function generateRoundRobinPairs(teamIds){
  var arr = teamIds.slice();
  if (arr.length % 2 === 1) arr.push(null);
  var n = arr.length;
  var rounds = [];
  for (var r = 0; r < n - 1; r++){
    var pairs = [];
    for (var i = 0; i < n/2; i++){
      var a = arr[i], b = arr[n-1-i];
      if (a != null && b != null) pairs.push([a,b]);
    }
    rounds.push(pairs);
    var fixed = arr[0];
    var rest = arr.slice(1);
    rest.unshift(rest.pop());
    arr = [fixed].concat(rest);
  }
  return rounds;
}

// ---- répartition équitable des terrains ----
// 1) round-robin : chaque équipe rencontre toutes les autres une fois ;
// 2) si une ronde compte plus de matchs que de terrains, elle est découpée en
//    plusieurs rondes (les équipes qui ne jouent pas attendent) ;
// 3) à chaque ronde, les matchs sont placés sur les terrains de façon à ce
//    que chaque équipe passe le même nombre de fois sur chaque terrain (à une
//    unité près quand ce n'est pas divisible). On essaie plusieurs centaines
//    de tirages et on garde le plus équilibré.
function permutationsOf(arr, k){
  var out = [];
  (function rec(prefix, rest){
    if (prefix.length === k){ out.push(prefix); return; }
    for (var i = 0; i < rest.length; i++) rec(prefix.concat([rest[i]]), rest.slice(0,i).concat(rest.slice(i+1)));
  })([], arr);
  return out;
}
function shuffled(arr){
  var a = arr.slice();
  for (var i = a.length-1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function planTournament(teamIds, courts){
  var rounds = generateRoundRobinPairs(teamIds);
  var courtIdx = []; for (var c = 0; c < courts; c++) courtIdx.push(c);
  var permCache = {};
  var best = null;
  var tries = courts <= 1 ? 1 : 400;
  for (var attempt = 0; attempt < tries; attempt++){
    var counts = {};
    teamIds.forEach(function(t){ counts[t] = courtIdx.map(function(){ return 0; }); });
    var waves = [];
    var order = attempt === 0 ? rounds : shuffled(rounds);
    order.forEach(function(pairs){
      var ps = attempt === 0 ? pairs.slice() : shuffled(pairs);
      for (var start = 0; start < ps.length; start += courts){
        var group = ps.slice(start, start + courts);
        var k = group.length;
        var perms = permCache[k] || (permCache[k] = (courts <= 7 ? permutationsOf(courtIdx, k) : null));
        var chosen;
        if (perms){
          var bestCost = Infinity, cands = [];
          perms.forEach(function(p){
            var cost = 0;
            for (var i = 0; i < k; i++){
              var a = counts[group[i][0]][p[i]], b = counts[group[i][1]][p[i]];
              cost += (a+1)*(a+1) + (b+1)*(b+1);
            }
            if (cost < bestCost){ bestCost = cost; cands = [p]; }
            else if (cost === bestCost) cands.push(p);
          });
          chosen = cands[attempt === 0 ? 0 : Math.floor(Math.random()*cands.length)];
        } else {
          var free = courtIdx.slice(); chosen = [];
          group.forEach(function(g){
            free.sort(function(x, y){ return (counts[g[0]][x]+counts[g[1]][x]) - (counts[g[0]][y]+counts[g[1]][y]); });
            chosen.push(free.shift());
          });
        }
        var wave = group.map(function(g, i){
          counts[g[0]][chosen[i]]++; counts[g[1]][chosen[i]]++;
          return {a:g[0], b:g[1], court:chosen[i]};
        }).sort(function(x, y){ return x.court - y.court; });
        waves.push(wave);
      }
    });
    // score : écart max-min par équipe (à minimiser), puis somme des carrés
    var spread = 0, sq = 0;
    teamIds.forEach(function(t){
      var arr = counts[t];
      spread += Math.max.apply(null, arr) - Math.min.apply(null, arr);
      arr.forEach(function(v){ sq += v*v; });
    });
    var score = spread * 10000 + sq;
    if (!best || score < best.score) best = {score: score, waves: waves, counts: counts};
  }
  return best;
}
// Nombre de passages de chaque équipe sur chaque terrain pour une leçon
function courtUsage(seanceId, courts){
  var usage = {};
  state.teams.forEach(function(t){ usage[t.id] = []; for (var i = 0; i < courts; i++) usage[t.id].push(0); });
  state.matches.forEach(function(m){
    if (m.seanceId !== seanceId) return;
    var ci = (m.slot||1) - 1;
    [m.teamAId, m.teamBId].forEach(function(t){
      if (!usage[t]) return;
      while (usage[t].length <= ci) usage[t].push(0);
      usage[t][ci]++;
    });
  });
  return usage;
}

function computeRanking(scopeIds){
  var matches = state.matches.filter(function(m){
    return scopeIncludes(scopeIds, m.seanceId) && m.scoreA != null && m.scoreB != null;
  });
  var stats = {};
  state.teams.forEach(function(t){ stats[t.id] = {teamId:t.id, played:0, wins:0, draws:0, losses:0, goalPos:0}; });
  matches.forEach(function(m){
    if (!stats[m.teamAId] || !stats[m.teamBId]) return;
    var a = stats[m.teamAId], b = stats[m.teamBId];
    a.played++; b.played++;
    var diff = m.scoreA - m.scoreB;
    if (diff > 0) { a.wins++; b.losses++; }
    else if (diff < 0) { b.wins++; a.losses++; }
    else { a.draws++; b.draws++; }
    a.goalPos += Math.max(0, diff);
    b.goalPos += Math.max(0, -diff);
  });
  var maxPlayed = Object.values(stats).reduce(function(m,s){ return Math.max(m, s.played); }, 0);
  var list = Object.values(stats).map(function(s){
    var coef = s.played > 0 ? (maxPlayed / s.played) : 0;
    return Object.assign({}, s, {
      coef: coef,
      adjPoints: s.wins * coef,
      adjGoal: s.goalPos * coef
    });
  });
  list.sort(function(a,b){
    if (b.adjPoints !== a.adjPoints) return b.adjPoints - a.adjPoints;
    if (b.adjGoal !== a.adjGoal) return b.adjGoal - a.adjGoal;
    return colorForTeam(a.teamId).label.localeCompare(colorForTeam(b.teamId).label);
  });
  return {maxPlayed: maxPlayed, list: list};
}

function computeTirRanking(scopeIds){
  var tirs = state.tirs.filter(function(t){ return scopeIncludes(scopeIds, t.seanceId); });
  var byStudent = {};
  state.students.forEach(function(s){ byStudent[s.id] = {studentId:s.id, teamId:s.teamId, values:[]}; });
  var byTeam = {};
  state.teams.forEach(function(t){ byTeam[t.id] = {teamId:t.id, values:[]}; });
  tirs.forEach(function(t){
    var vals = tirAllPoints(t);
    if (!vals.length) return;
    if (byStudent[t.studentId]) byStudent[t.studentId].values = byStudent[t.studentId].values.concat(vals);
    if (byTeam[t.teamId]) byTeam[t.teamId].values = byTeam[t.teamId].values.concat(vals);
  });
  function toStats(obj, extra){
    return Object.keys(obj).map(function(k){
      var e = obj[k];
      var n = e.values.length;
      var avg = n ? e.values.reduce(function(a,b){return a+b;},0)/n : null;
      var best = n ? Math.max.apply(null, e.values) : null;
      return Object.assign({}, e, extra, {n:n, avg:avg, best:best});
    });
  }
  var students = toStats(byStudent).filter(function(s){ return s.n > 0; });
  var teams = toStats(byTeam).filter(function(s){ return s.n > 0; });
  function cmp(a, b){
    if (b.avg !== a.avg) return b.avg - a.avg;
    if (b.best !== a.best) return b.best - a.best;
    return 0;
  }
  students.sort(function(a,b){
    var c = cmp(a,b); if (c) return c;
    var sa = studentById(a.studentId), sb = studentById(b.studentId);
    return (sa?sa.firstName:'').localeCompare(sb?sb.firstName:'');
  });
  teams.sort(function(a,b){
    var c = cmp(a,b); if (c) return c;
    return colorForTeam(a.teamId).label.localeCompare(colorForTeam(b.teamId).label);
  });
  return {students: students, teams: teams};
}

// ---- classement général (points cumulés tir + matchs, par leçon et sur le cycle) ----
// Points matchs (par ronde, pour chaque équipe) : victoire (5 pts si 3 marqueurs
// différents, sinon 4) / égalité (3 pts si 3 marqueurs différents, sinon 2) /
// défaite (3 pts si 3 marqueurs différents, sinon 1).
var MATCH_POINTS_TABLE = {
  win:  {three:5, normal:4},
  draw: {three:3, normal:2},
  loss: {three:3, normal:1}
};
function matchPointsFor(result, hasThree){
  return MATCH_POINTS_TABLE[result][hasThree ? 'three' : 'normal'];
}
// Points de la série de tir pour une leçon donnée : les équipes sont classées
// sur leur total de points pondéré (pour ne pas pénaliser une équipe à
// l'effectif réduit — équipe à 3, ou élève absent — son total est ramené à
// l'équivalent du nombre de tireurs le plus élevé parmi les équipes de la
// leçon), puis reçoivent n-1, n-2, ... 0 points selon leur rang (n = nombre
// d'équipes).
function tirPointsForSeance(seanceId){
  var teams = state.teams;
  var perTeam = teams.map(function(t){
    var studentIds = studentsOfTeam(t.id).map(function(s){ return s.id; });
    var shooters = 0, rawTotal = 0;
    state.tirs.forEach(function(tir){
      if (tir.seanceId !== seanceId || studentIds.indexOf(tir.studentId) === -1) return;
      var vals = tirAllPoints(tir);
      vals.forEach(function(v){ rawTotal += v; });
      if (vals.length) shooters++;
    });
    return {teamId: t.id, shooters: shooters, rawTotal: rawTotal};
  });
  var maxShooters = perTeam.reduce(function(m, r){ return Math.max(m, r.shooters); }, 0);
  perTeam.forEach(function(r){
    r.weighted = (r.shooters > 0 && maxShooters > 0) ? r.rawTotal * (maxShooters / r.shooters) : 0;
  });
  perTeam.sort(function(a, b){
    if (b.weighted !== a.weighted) return b.weighted - a.weighted;
    return colorForTeam(a.teamId).label.localeCompare(colorForTeam(b.teamId).label);
  });
  var n = perTeam.length;
  var points = {};
  perTeam.forEach(function(r, i){ points[r.teamId] = {points: Math.max(0, n - 1 - i), weighted: r.weighted, shooters: r.shooters}; });
  return points;
}
function matchPointsForSeance(seanceId){
  var points = {};
  state.teams.forEach(function(t){ points[t.id] = 0; });
  state.matches.forEach(function(m){
    if (m.seanceId !== seanceId || m.scoreA == null || m.scoreB == null) return;
    var diff = m.scoreA - m.scoreB;
    var resultA = diff > 0 ? 'win' : (diff < 0 ? 'loss' : 'draw');
    var resultB = diff > 0 ? 'loss' : (diff < 0 ? 'win' : 'draw');
    if (points[m.teamAId] != null) points[m.teamAId] += matchPointsFor(resultA, !!m.scorersA3);
    if (points[m.teamBId] != null) points[m.teamBId] += matchPointsFor(resultB, !!m.scorersB3);
  });
  return points;
}
// Points « super pouvoir » d'une leçon : nombre d'utilisations × bonus de la leçon
function powerPointsForSeance(seanceId){
  var points = {};
  state.teams.forEach(function(t){ points[t.id] = 0; });
  var p = seancePower(seanceById(seanceId));
  var bonus = p ? p.bonus : 2;
  state.matches.forEach(function(m){
    if (m.seanceId !== seanceId || m.scoreA == null || m.scoreB == null) return;
    if (points[m.teamAId] != null) points[m.teamAId] += (m.powerA||0) * bonus;
    if (points[m.teamBId] != null) points[m.teamBId] += (m.powerB||0) * bonus;
  });
  return points;
}
function computeGeneralRanking(scopeIds){
  var seances = seancesChrono().filter(function(s){ return scopeIncludes(scopeIds, s.id); });
  var totals = {};
  state.teams.forEach(function(t){ totals[t.id] = {teamId:t.id, tirPoints:0, matchPoints:0, powerPoints:0}; });
  var bySeance = seances.map(function(sea){
    var tirPts = tirPointsForSeance(sea.id);
    var matchPts = matchPointsForSeance(sea.id);
    var powerPts = powerPointsForSeance(sea.id);
    state.teams.forEach(function(t){
      totals[t.id].tirPoints += (tirPts[t.id] && tirPts[t.id].points) || 0;
      totals[t.id].matchPoints += matchPts[t.id] || 0;
      totals[t.id].powerPoints += powerPts[t.id] || 0;
    });
    return {seance: sea, tirPts: tirPts, matchPts: matchPts, powerPts: powerPts};
  });
  var list = Object.values(totals).map(function(t){
    return Object.assign({}, t, {total: t.tirPoints + t.matchPoints + t.powerPoints});
  });
  list.sort(function(a, b){
    if (b.total !== a.total) return b.total - a.total;
    return colorForTeam(a.teamId).label.localeCompare(colorForTeam(b.teamId).label);
  });
  return {list: list, bySeance: bySeance, scopeIds: scopeIds};
}
// Rangs (1 = premier, ex æquo partagés) à partir d'une liste triée et d'une clé
function ranksOf(list, keyFn){
  var ranks = {}, prevKey = null, prevRank = 0;
  list.forEach(function(r, i){
    var k = keyFn(r);
    var rank = (i > 0 && k === prevKey) ? prevRank : i+1;
    ranks[r.teamId || r.studentId] = rank; prevKey = k; prevRank = rank;
  });
  return ranks;
}
function evoHtml(prevRanks, id, rank){
  if (!prevRanks || prevRanks[id] == null) return '<td></td>';
  var d = prevRanks[id] - rank;
  if (d > 0) return '<td><span class="rank-evo up" title="Gagne '+d+' place(s) depuis la leçon précédente">▲ '+d+'</span></td>';
  if (d < 0) return '<td><span class="rank-evo down" title="Perd '+(-d)+' place(s) depuis la leçon précédente">▼ '+(-d)+'</span></td>';
  return '<td><span class="rank-evo muted">=</span></td>';
}
function scopeTitle(scope){
  if (!scope || scope === 'all') return 'Tout le cycle';
  var chrono = seancesChrono();
  var parts = scope.split(':'); var kind = parts.length>1?parts[0]:'only'; var id = parts.length>1?parts[1]:parts[0];
  var idx = chrono.findIndex(function(s){ return s.id===id; });
  if (idx === -1) return '';
  return (kind === 'upto' ? 'Classement à l\'issue de la leçon '+(idx+1) : 'Leçon '+(idx+1)+' seule') + ' — ' + chrono[idx].label;
}
function scopeSelectHtml(id, action, current){
  return '<div class="field"><label>Classement</label><select id="'+id+'" data-action="'+action+'">'+scopeOptionsHtml(current)+'</select></div>';
}

function wireDynamic(){
  var profCodeInput = document.getElementById('prof-code-input');
  if (profCodeInput){
    profCodeInput.focus();
    profCodeInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter') handleAction('prof-code-submit', profCodeInput);
    });
  }
  var slider = document.getElementById('score-slider');
  if (slider){
    slider.addEventListener('input', function(){
      state.saisieValue = parseFloat(slider.value);
      var disp = document.getElementById('slider-display');
      var shots = slider.getAttribute('data-shots');
      if (disp) disp.innerHTML = fmtNum(state.saisieValue) + (shots ? ' <small style="font-size:.4em">/ '+shots+'</small>' : '');
      var pd = document.getElementById('slider-points');
      if (pd) pd.textContent = '= ' + fmtNum(state.saisieValue * (parseInt(slider.getAttribute('data-value'),10)||1)) + ' pts';
    });
  }
  var scoreASlider = document.getElementById('match-scoreA');
  if (scoreASlider){
    scoreASlider.addEventListener('input', function(){
      state.matchForm.scoreA = parseFloat(scoreASlider.value);
      var disp = document.getElementById('match-scoreA-display');
      if (disp) disp.textContent = fmtNum(state.matchForm.scoreA);
    });
  }
  var scoreBSlider = document.getElementById('match-scoreB');
  if (scoreBSlider){
    scoreBSlider.addEventListener('input', function(){
      state.matchForm.scoreB = parseFloat(scoreBSlider.value);
      var disp = document.getElementById('match-scoreB-display');
      if (disp) disp.textContent = fmtNum(state.matchForm.scoreB);
    });
  }
  var rdSliders = document.querySelectorAll('.rd-score');
  for (var i=0; i<rdSliders.length; i++){
    (function(sl){
      sl.addEventListener('input', function(){
        var id = sl.getAttribute('data-id'), side = sl.getAttribute('data-side');
        if (!state.roundEntry[id]) state.roundEntry[id] = {scoreA:0, scoreB:0, scorersA:false, scorersB:false};
        state.roundEntry[id]['score'+side] = parseFloat(sl.value);
        var disp = document.getElementById('rd-score'+side+'-disp-'+id);
        if (disp) disp.textContent = fmtNum(state.roundEntry[id]['score'+side]);
      });
    })(rdSliders[i]);
  }
}

function genId(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function handleAction(action, el){
  var db = state.db;
  switch(action){
    case 'go-home': setView('eleve-home'); break;
    case 'go-eleve':
      ensureClassSubscribed(state.config.activeClassId);
      setView('eleve-home');
      break;
    case 'go-eleve-precision':
      ensureClassSubscribed(state.config.activeClassId);
      setView('eleve-equipe', {student:{teamId:null, studentId:null}});
      break;
    case 'go-prof':
      if (state.profUnlocked){
        if (!state.adminClassId && state.classes.length) state.adminClassId = state.config.activeClassId || state.classes[0].id;
        ensureClassSubscribed(state.adminClassId);
        setView('prof');
      } else {
        setView('prof-code');
      }
      break;
    case 'prof-code-submit':
      var enteredCode = (document.getElementById('prof-code-input') || {}).value || '';
      var expectedCode = state.config.profCode || '0000';
      if (enteredCode === expectedCode){
        state.profUnlocked = true;
        if (!state.adminClassId && state.classes.length) state.adminClassId = state.config.activeClassId || state.classes[0].id;
        ensureClassSubscribed(state.adminClassId);
        setView('prof');
      } else {
        flash('Code incorrect.', 'error');
        render();
      }
      break;
    case 'prof-code-cancel': setView('eleve-home'); break;
    case 'change-prof-code':
      var newCode = (document.getElementById('new-prof-code') || {}).value || '';
      if (!/^\d{4}$/.test(newCode)){ flash('Le code doit contenir exactement 4 chiffres.', 'error'); return; }
      db.doc('app/config').set(Object.assign({}, state.config, {profCode: newCode})).then(function(){
        flash('Code enseignant mis à jour.');
      });
      break;
    case 'pick-team':
      state.student.teamId = el.getAttribute('data-id');
      setView('eleve-prenom');
      break;
    case 'pick-student':
      state.student.studentId = el.getAttribute('data-id');
      setView('eleve-fiche');
      break;
    case 'start-saisie':
      state.saisieSerie = parseInt(el.getAttribute('data-serie'), 10);
      var sea = activeSeance();
      var ss = seanceSeries(sea)[state.saisieSerie-1] || seanceSeries(sea)[0];
      state.saisieValue = Math.round(ss.min + (ss.shots - ss.min) / 2);
      setView('eleve-saisie');
      break;
    case 'cancel-saisie': setView('eleve-fiche'); break;
    case 'valider-saisie': validerSaisie(); break;
    case 'go-eleve-matchs':
      ensureClassSubscribed(state.config.activeClassId);
      state.roundEntry = {};
      setView('eleve-matchs');
      break;
    case 'save-round-scores': saveRoundScores(); break;
    case 'toggle-scorers3':
      var rid = el.getAttribute('data-id'), rside = el.getAttribute('data-side');
      if (!state.roundEntry[rid]) state.roundEntry[rid] = {scoreA:0, scoreB:0, scorersA:false, scorersB:false};
      state.roundEntry[rid]['scorers'+rside] = !state.roundEntry[rid]['scorers'+rside];
      render();
      break;
    case 'toggle-absence': toggleAbsence(el.getAttribute('data-seance'), el.getAttribute('data-id')); break;
    case 'timer-start': startTimer(); break;
    case 'timeout-start': startTimeout(); break;
    case 'timeout-end': endTimeout(); break;
    case 'timeout-adjust':
      var td = Math.min(300, Math.max(15, timeoutDuration() + (parseInt(el.getAttribute('data-delta'),10)||0)));
      db.doc('app/config').set(Object.assign({}, state.config, {timeoutDuration: td}));
      break;
    case 'timer-pause': pauseTimer(); break;
    case 'timer-end': endTimerNow(); break;
    case 'timer-reset': resetTimer(); break;
    case 'timer-adjust':
      // + / − : 1 minute. Avant le début : change la durée. Pendant le match
      // (ou en pause) : ajoute/retire aussi une minute au temps restant.
      var delta = parseInt(el.getAttribute('data-delta'), 10) || 0;
      var rt = state.roundTimer;
      var started = rt.running || (rt.remaining < rt.duration && !rt.ended);
      rt.duration = Math.max(60, rt.duration + delta);
      if (started){
        rt.remaining = Math.max(1, Math.min(rt.duration, rt.remaining + delta));
      } else if (!rt.ended){
        rt.remaining = rt.duration; rt.halfBeeped = false;
      }
      render();
      break;
    case 'timer-duration-preset':
      var presetMins = parseInt(el.getAttribute('data-minutes'), 10) || 8;
      state.roundTimer.duration = presetMins * 60;
      if (!state.roundTimer.running){ state.roundTimer.remaining = state.roundTimer.duration; state.roundTimer.halfBeeped = false; }
      render();
      break;

    case 'prof-tab': state.adminTab = el.getAttribute('data-tab'); state.classementResult=null; state.classementTirResult=null; state.classementGeneralResult=null; render(); break;
    case 'select-class':
      var scId = el.getAttribute('data-id');
      state.adminClassId = scId;
      ensureClassSubscribed(scId);
      db.doc('app/config').set(Object.assign({}, state.config, {activeClassId: scId, activeSeanceId: null}));
      flash('Classe en cours : cette classe est maintenant gérée et visible côté élèves.');
      break;
    case 'create-class': createClass(); break;
    case 'delete-class': deleteClass(el.getAttribute('data-id')); break;

    case 'add-team': addTeam(); break;
    case 'recolor-team': recolorTeam(el.getAttribute('data-id'), el.value); break;
    case 'delete-team': deleteTeam(el.getAttribute('data-id')); break;
    case 'add-student': addStudent(el.getAttribute('data-team')); break;
    case 'delete-student': deleteStudent(el.getAttribute('data-id')); break;

    case 'create-seance': createSeance(); break;
    case 'seance-series-add':
      if (state.seanceForm && state.seanceForm.series.length < 10){
        var prevS = state.seanceForm.series[state.seanceForm.series.length-1] || {shots:10, value:1};
        state.seanceForm.series.push({name:'Série '+(state.seanceForm.series.length+1), shots: prevS.shots, value: prevS.value});
      }
      render();
      break;
    case 'seance-series-remove':
      if (state.seanceForm && state.seanceForm.series.length > 1){
        state.seanceForm.series.splice(parseInt(el.getAttribute('data-idx'),10), 1);
      }
      render();
      break;
    case 'edit-seance':
      var es = seanceById(el.getAttribute('data-id'));
      if (es){ state.seanceForm = seanceFormFrom(es); render(); window.scrollTo({top:0, behavior:'smooth'}); }
      break;
    case 'cancel-edit-seance': state.seanceForm = null; render(); break;
    case 'delete-seance': deleteSeance(el.getAttribute('data-id')); break;
    case 'set-active-seance':
      db.doc('app/config').set(Object.assign({}, state.config, {activeClassId: state.adminClassId, activeSeanceId: el.getAttribute('data-id')}));
      flash('Leçon activée pour les élèves.');
      break;

    case 'filter-resultats': state.profSeanceFilter = el.value || null; render(); break;
    case 'export-csv': exportCsv(); break;
    case 'export-xlsx': exportXlsx(); break;
    case 'export-json-backup': exportJsonBackup(); break;
    case 'trigger-import': document.getElementById('backup-file-input').click(); break;
    case 'import-json-backup': importJsonBackup(el.files && el.files[0]); break;
    case 'delete-tir': db.doc('classes/'+state.adminClassId+'/tirs/'+el.getAttribute('data-id')).delete(); break;

    case 'match-field': state.matchForm[el.getAttribute('data-f')] = el.value; render(); break;
    case 'tournament-field': state.tournamentForm[el.getAttribute('data-f')] = el.value; render(); break;
    case 'add-match': addMatch(); break;
    case 'edit-match': editMatch(el.getAttribute('data-id')); break;
    case 'match-scorers-toggle':
      var mside = el.getAttribute('data-side');
      state.matchForm['scorers'+mside] = !state.matchForm['scorers'+mside];
      render();
      break;
    case 'cancel-edit-match':
      state.matchForm = {seanceId: state.matchForm.seanceId, teamA:null, teamB:null, scoreA:0, scoreB:0, scorersA:false, scorersB:false, powerA:0, powerB:0, editingId:null};
      render();
      break;
    case 'match-power':
      var mpside = el.getAttribute('data-side');
      state.matchForm['power'+mpside] = Math.max(0, (state.matchForm['power'+mpside]||0) + (parseInt(el.getAttribute('data-delta'),10)||0));
      render();
      break;
    case 'round-power':
      var rpid = el.getAttribute('data-id'), rpside = el.getAttribute('data-side');
      if (!state.roundEntry[rpid]) state.roundEntry[rpid] = {scoreA:0, scoreB:0, scorersA:false, scorersB:false, powerA:0, powerB:0};
      state.roundEntry[rpid]['power'+rpside] = Math.max(0, (state.roundEntry[rpid]['power'+rpside]||0) + (parseInt(el.getAttribute('data-delta'),10)||0));
      render();
      break;
    case 'save-power':
      var psea = activeSeance(); if (!psea) break;
      var pname = ((document.getElementById('power-name')||{}).value || '').trim();
      var pbonus = Math.max(1, parseInt((document.getElementById('power-bonus')||{}).value, 10) || 2);
      db.doc('classes/'+state.adminClassId+'/seances/'+psea.id).update({powerName: pname, powerBonus: pbonus}).then(function(){
        state.classementGeneralResult = null;
        flash(pname ? 'Super pouvoir enregistré : « '+pname+' » (+'+pbonus+' par utilisation).' : 'Super pouvoir désactivé pour cette leçon.');
      });
      break;
    case 'courts-adjust':
      var nc = Math.min(8, Math.max(1, currentCourts() + (parseInt(el.getAttribute('data-delta'),10)||0)));
      db.doc('app/config').set(Object.assign({}, state.config, {courtCount: nc}));
      break;
    case 'court-name':
      var cidx = parseInt(el.getAttribute('data-idx'), 10);
      var cnames = (state.config.courtNames || []).slice();
      while (cnames.length <= cidx) cnames.push('');
      if (cnames[cidx] === (el.value || '').trim()) break;
      cnames[cidx] = (el.value || '').trim();
      db.doc('app/config').set(Object.assign({}, state.config, {courtNames: cnames}));
      break;
    case 'generate-schedule': generateSchedule(); break;
    case 'delete-match':
      if (confirm('Supprimer ce match ?')) db.doc('classes/'+state.adminClassId+'/matches/'+el.getAttribute('data-id')).delete();
      break;

    case 'classement-scope': state.classementScope = el.value; state.classementResult = null; render(); break;
    case 'calc-classement':
      state.classementResult = computeRanking(resolveScope(state.classementScope));
      render();
      break;
    case 'classement-tir-scope': state.classementTirScope = el.value; state.classementTirResult = null; render(); break;
    case 'calc-classement-tir':
      state.classementTirResult = computeTirRanking(resolveScope(state.classementTirScope));
      render();
      break;
    case 'classement-general-scope': state.classementGeneralScope = el.value; state.classementGeneralResult = null; render(); break;
    case 'calc-classement-general':
      state.classementGeneralResult = computeGeneralRanking(resolveScope(state.classementGeneralScope));
      render();
      break;
  }
}

function validerSaisie(){
  var db = state.db;
  var sea = activeSeance();
  var stu = studentById(state.student.studentId);
  if (!db || !sea || !stu) return;
  var docId = sea.id + '_' + stu.id;
  var ref = db.doc('classes/'+state.config.activeClassId+'/tirs/'+docId);
  var n = state.saisieSerie;
  var s = seanceSeries(sea)[n-1];
  var made = Math.round(state.saisieValue);
  var payload = {}; payload['ts'+n] = Date.now();
  if (s && !s.legacy){
    payload['made'+n] = made;
    payload['serie'+n] = made * s.value;
  } else {
    payload['serie'+n] = made;
  }
  ref.get().then(function(snap){
    if (snap.exists){
      return ref.update(payload);
    }
    var full = Object.assign({seanceId: sea.id, studentId: stu.id, teamId: stu.teamId}, payload);
    return ref.set(full);
  }).then(function(){
    flash('Score enregistré.');
    setView('eleve-fiche');
  }).catch(function(e){
    console.error(e);
    flash('Erreur lors de l\'enregistrement.', 'error');
  });
}

// ---- bip sonore de mi-temps (remplacements) : Web Audio API, aucun fichier
// audio nécessaire. audioCtx est créé/débloqué lors d'un geste utilisateur
// (clic sur « Début ») car iOS/Safari refuse de jouer du son sinon.
var audioCtx = null;
function ensureAudioCtx(){
  if (!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume().catch(function(){}); }
  return audioCtx;
}
function playBeep(freq, startAt, dur){
  var ctx = ensureAudioCtx();
  if (!ctx) return;
  try{
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq || 880;
    gain.gain.value = 0.4;
    osc.connect(gain); gain.connect(ctx.destination);
    var t0 = ctx.currentTime + (startAt || 0);
    osc.start(t0);
    osc.stop(t0 + (dur || 0.35));
  }catch(e){ console.error('beep', e); }
}
function playHalfTimeBeep(){
  // deux bips courts, plus reconnaissable qu'un simple signal de fin.
  playBeep(880, 0, 0.3);
  playBeep(880, 0.4, 0.3);
}

function tickTimer(){
  if (!state.roundTimer.running) return;
  state.roundTimer.remaining = Math.max(0, state.roundTimer.remaining - 1);
  var half = Math.floor(state.roundTimer.duration / 2);
  if (half > 0 && state.roundTimer.remaining === half && !state.roundTimer.halfBeeped){
    state.roundTimer.halfBeeped = true;
    playHalfTimeBeep();
    flash('🔔 Mi-temps — pensez aux remplacements !');
  }
  var disp = document.getElementById('timer-display');
  if (disp && state.roundTimer.remaining > 0){
    disp.textContent = formatTimer(state.roundTimer.remaining);
  }
  if (state.roundTimer.remaining === 0){
    state.roundTimer.running = false;
    state.roundTimer.ended = true;
    if (roundTimerHandle){ clearInterval(roundTimerHandle); roundTimerHandle = null; }
    render();
  }
}
function startTimer(){
  if (state.roundTimer.running || state.roundTimer.ended || state.timeout.active) return;
  ensureAudioCtx();
  if (state.roundTimer.remaining <= 0) state.roundTimer.remaining = state.roundTimer.duration;
  state.roundTimer.running = true;
  roundTimerHandle = setInterval(tickTimer, 1000);
  render();
}
function pauseTimer(){
  state.roundTimer.running = false;
  if (roundTimerHandle){ clearInterval(roundTimerHandle); roundTimerHandle = null; }
  render();
}
function endTimerNow(){
  cancelTimeout();
  state.roundTimer.running = false;
  state.roundTimer.remaining = 0;
  state.roundTimer.ended = true;
  if (roundTimerHandle){ clearInterval(roundTimerHandle); roundTimerHandle = null; }
  render();
}
// ---- temps mort : arrête le chrono du match, décompte sa propre durée
// (réglée dans l'onglet Matchs), bip à la fin, puis relance le match s'il
// était en cours.
var timeoutHandle = null;
function timeoutDuration(){
  var d = parseInt(state.config.timeoutDuration, 10);
  return d > 0 ? d : 60;
}
function formatTimeoutLabel(sec){
  if (sec % 60 === 0) return (sec/60) + ' min';
  if (sec < 60) return sec + ' s';
  return Math.floor(sec/60) + ' min ' + (sec%60) + ' s';
}
function cancelTimeout(){
  if (timeoutHandle){ clearInterval(timeoutHandle); timeoutHandle = null; }
  state.timeout.active = false; state.timeout.remaining = 0; state.timeout.resumeAfter = false;
}
function startTimeout(){
  var rt = state.roundTimer;
  if (rt.ended || state.timeout.active) return;
  ensureAudioCtx();
  state.timeout.resumeAfter = rt.running;
  rt.running = false;
  if (roundTimerHandle){ clearInterval(roundTimerHandle); roundTimerHandle = null; }
  state.timeout.active = true;
  state.timeout.remaining = timeoutDuration();
  playBeep(660, 0, 0.5);
  timeoutHandle = setInterval(tickTimeout, 1000);
  render();
}
function tickTimeout(){
  if (!state.timeout.active) return;
  state.timeout.remaining = Math.max(0, state.timeout.remaining - 1);
  var disp = document.getElementById('timeout-display');
  if (disp) disp.textContent = formatTimer(state.timeout.remaining);
  if (state.timeout.remaining <= 10 && state.timeout.remaining > 0) playBeep(990, 0, 0.08);
  if (state.timeout.remaining === 0) endTimeout();
}
function endTimeout(){
  var resume = state.timeout.resumeAfter;
  cancelTimeout();
  playBeep(880, 0, 0.3); playBeep(880, 0.4, 0.3); playBeep(1175, 0.8, 0.6);
  if (resume) startTimer(); else render();
}

function resetTimer(){
  cancelTimeout();
  state.roundTimer.running = false;
  if (roundTimerHandle){ clearInterval(roundTimerHandle); roundTimerHandle = null; }
  state.roundTimer.remaining = state.roundTimer.duration;
  state.roundTimer.ended = false;
  state.roundTimer.halfBeeped = false;
  render();
}

function addTeam(){
  var used = usedColorIds(null);
  var free = TEAM_COLORS.find(function(c){ return used.indexOf(c.id) === -1; });
  if (!free){ flash('Les 9 couleurs sont déjà utilisées.', 'error'); return; }
  state.db.collection('classes/'+state.adminClassId+'/teams').add({color: free.id, createdAt: Date.now()});
}
function recolorTeam(teamId, newColorId){
  var t = teamById(teamId);
  if (!t) return;
  var oldColorId = t.color || t.id;
  if (oldColorId === newColorId) return;
  var swapWith = state.teams.find(function(other){ return other.id !== teamId && (other.color || other.id) === newColorId; });
  var base = 'classes/'+state.adminClassId+'/teams/';
  function bodyWithColor(team, colorId){
    var b = Object.assign({}, team);
    delete b.id;
    b.color = colorId;
    return b;
  }
  var writes = [ state.db.doc(base+teamId).set(bodyWithColor(t, newColorId)) ];
  if (swapWith){
    writes.push(state.db.doc(base+swapWith.id).set(bodyWithColor(swapWith, oldColorId)));
  }
  Promise.all(writes).then(function(){
    flash(swapWith ? 'Couleurs échangées.' : 'Couleur mise à jour.');
  });
}
function deleteTeam(teamId){
  var t = teamById(teamId);
  if (!t) return;
  var students = studentsOfTeam(teamId);
  var relatedMatches = state.matches.filter(function(m){ return m.teamAId===teamId || m.teamBId===teamId; });
  var relatedTirs = state.tirs.filter(function(tir){ return tir.teamId===teamId; });
  var studentIds = students.map(function(s){ return s.id; });
  var relatedAbsences = state.absences.filter(function(a){ return studentIds.indexOf(a.studentId) !== -1; });
  var warnParts = [];
  if (students.length) warnParts.push(students.length+' élève(s)');
  if (relatedMatches.length) warnParts.push(relatedMatches.length+' match(s)');
  if (relatedTirs.length) warnParts.push(relatedTirs.length+' résultat(s) de tir');
  var msg = 'Supprimer cette équipe ?' + (warnParts.length ? ' Cela supprimera aussi : '+warnParts.join(', ')+'.' : '');
  if (!confirm(msg)) return;
  var base = 'classes/'+state.adminClassId;
  Promise.all(
    students.map(function(s){ return state.db.doc(base+'/students/'+s.id).delete(); })
    .concat(relatedMatches.map(function(m){ return state.db.doc(base+'/matches/'+m.id).delete(); }))
    .concat(relatedTirs.map(function(tir){ return state.db.doc(base+'/tirs/'+tir.id).delete(); }))
    .concat(relatedAbsences.map(function(a){ return state.db.doc(base+'/absences/'+a.id).delete(); }))
  ).then(function(){
    return state.db.doc(base+'/teams/'+teamId).delete();
  }).then(function(){
    flash('Équipe supprimée.');
  });
}

function createSeance(){
  var f = state.seanceForm;
  if (!f) return;
  var date = f.date || new Date().toISOString().slice(0,10);
  var label = (f.label || '').trim() || ('Leçon du ' + date);
  var series = f.series.map(function(s, i){
    return {
      name: (s.name || '').trim() || ('Série '+(i+1)),
      shots: Math.max(1, parseInt(s.shots, 10) || 10),
      value: Math.max(1, parseInt(s.value, 10) || 1)
    };
  });
  var bonus = Math.max(1, parseInt(f.powerBonus, 10) || 2);
  var data = {
    label: label, date: date, series: series,
    // tirMin/tirMax conservés pour compatibilité avec les anciennes versions
    tirMin: 0, tirMax: series[0].shots, tirStep: 1,
    powerName: (f.powerName || '').trim(), powerBonus: bonus
  };
  var base = 'classes/'+state.adminClassId+'/seances';
  if (f.editingId){
    state.db.doc(base+'/'+f.editingId).update(data).then(function(){
      state.seanceForm = null;
      state.classementResult = null; state.classementTirResult = null; state.classementGeneralResult = null;
      flash('Leçon modifiée.');
    });
    return;
  }
  data.createdAt = Date.now();
  state.db.collection(base).add(data).then(function(ref){
    state.seanceForm = null;
    state.db.doc('app/config').set(Object.assign({}, state.config, {activeClassId: state.adminClassId, activeSeanceId: ref.id}));
    flash('Leçon créée et activée.');
  });
}

function deleteSeance(id){

  if (state.seanceForm && state.seanceForm.editingId === id) state.seanceForm = null;
  var base = 'classes/'+state.adminClassId;
  Promise.all([

    }),
