<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TirScore</title>
<meta name="description" content="Saisie des scores de tir et classement d'équipes pour l'EPS">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff4d1c">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TirScore">
<meta name="mobile-web-app-capable" content="yes">
<meta name="msapplication-TileImage" content="icon-256.png">
<meta name="msapplication-TileColor" content="#ff4d1c">
<style>

@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#f3f5f1;
  --surface:#ffffff;
  --surface-2:#edf1ea;
  --ink:#12181a;
  --ink-dim:#57655f;
  --border:#dbe2d8;
  --accent:#ff4d1c;
  --accent2:#0a6dff;
  --accent-ink:#ffffff;
  --accent-soft:#ffe2d4;
  --warn:#ffb200;
  --danger:#ef233c;
  --danger-soft:#ffdce1;
  --good:#0fb85c;
  --radius:14px;
  --shadow:0 1px 2px rgba(20,30,25,.07), 0 8px 22px -10px rgba(20,30,25,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1210;
    --surface:#171e1a;
    --surface-2:#1d2621;
    --ink:#f2f6f2;
    --ink-dim:#aab8b0;
    --border:#2c3831;
    --accent:#ff6a3d;
    --accent2:#4d94ff;
    --accent-ink:#1a0800;
    --accent-soft:#3d2013;
    --warn:#ffc94d;
    --danger:#ff6b7a;
    --danger-soft:#3c1a1f;
    --good:#3fe08a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 26px -10px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1210;
  --surface:#171e1a;
  --surface-2:#1d2621;
  --ink:#f2f6f2;
  --ink-dim:#aab8b0;
  --border:#2c3831;
  --accent:#ff6a3d;
  --accent2:#4d94ff;
  --accent-ink:#1a0800;
  --accent-soft:#3d2013;
  --warn:#ffc94d;
  --danger:#ff6b7a;
  --danger-soft:#3c1a1f;
  --good:#3fe08a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 26px -10px rgba(0,0,0,.65);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Manrope',system-ui,sans-serif;
  padding-inline:16px;
}
h1,h2,h3,.display{
  font-family:'Oswald',"Arial Narrow",sans-serif;
  text-transform:uppercase;
  letter-spacing:.02em;
  text-wrap:balance;
  margin:0;
}
#app{width:95%;max-width:2400px;margin:0 auto;padding-block:20px 48px;}
.stage{max-width:none;}
.stage .card{padding:16px 20px;}
.hidden{display:none!important;}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;padding-bottom:14px;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--accent),var(--accent2),var(--good)) 1;}
.brand{display:flex;align-items:baseline;gap:8px;}
.brand .logo-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;}
.brand-logo{height:44px;width:auto;border-radius:9px;display:block;}
.brand h1.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
.brand h1{font-size:20px;color:var(--ink);}
.brand .tag{font-family:'Manrope';text-transform:none;font-size:12px;color:var(--ink-dim);letter-spacing:0;}
.btn{
  font-family:'Manrope';font-weight:700;font-size:14px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:10px 16px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
.btn:hover{border-color:var(--accent);}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.btn.primary{background:linear-gradient(135deg,var(--accent),#ff2d6b);color:var(--accent-ink);border-color:transparent;box-shadow:0 4px 14px -4px rgba(255,77,28,.55);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-dim);}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent;}
.btn.big{padding:20px 22px;font-size:17px;border-radius:16px;min-height:64px;width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
.stack{display:flex;flex-direction:column;gap:14px;}
.grid{display:grid;gap:14px;}
.center{max-width:none;margin:0 auto;}
.muted{color:var(--ink-dim);font-size:14px;}
.eyebrow{font-family:'Oswald';text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--accent);font-weight:600;}

.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.team-swatch{
  border:none;border-radius:16px;padding:22px 12px;min-height:96px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:#fff;font-family:'Oswald';font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.03em;
  box-shadow:var(--shadow);
}
.team-swatch small{font-family:'Manrope';text-transform:none;font-weight:600;font-size:12px;opacity:.85;letter-spacing:0;}
.team-swatch:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}

.name-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.name-btn{
  border-radius:12px;border:2px solid var(--border);background:var(--surface);
  padding:16px 10px;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);
}
.name-btn:hover{border-color:var(--accent);}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;}
.chip.outline{background:transparent;border:1px solid var(--border);color:var(--ink-dim);font-weight:600;}

.serie-card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface-2);}
.serie-score{font-family:'Oswald';font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--good);}
.serie-empty{color:var(--ink-dim);font-size:14px;}

.slider-wrap{text-align:center;padding:14px 4px;}
.slider-value{font-family:'Oswald';font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;margin-bottom:18px;}
input[type=range]{width:100%;height:44px;accent-color:var(--accent);}
.slider-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-dim);margin-top:4px;}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:0;}
.tab-btn{background:transparent;border:none;border-bottom:2px solid transparent;padding:10px 4px;margin-right:14px;font-family:'Oswald';text-transform:uppercase;letter-spacing:.04em;font-size:13px;color:var(--ink-dim);cursor:pointer;}
.tab-btn.active{color:var(--ink);border-color:var(--accent);}

.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select{
  font-family:'Manrope';font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink);
}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.row>.field{flex:1;min-width:120px;}

table{border-collapse:collapse;width:100%;font-size:14px;}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;}
th{font-family:'Oswald';text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--ink-dim);}
.table-wrap{overflow-x:auto;}
tr.rank-1 td{background:var(--accent-soft);}

.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;}
.iconbtn{background:transparent;border:none;color:var(--ink-dim);cursor:pointer;font-size:16px;padding:4px 8px;border-radius:8px;}
.iconbtn:hover{color:var(--danger);background:var(--danger-soft);}

.banner{border-radius:12px;padding:12px 16px;font-size:14px;display:flex;gap:10px;align-items:center;}
.banner.info{background:var(--accent-soft);color:var(--ink);}
.banner.warn{background:var(--danger-soft);color:var(--ink);}

.empty{text-align:center;padding:40px 20px;color:var(--ink-dim);}

@media (max-width:520px){
  .slider-value{font-size:48px;}
  .row{flex-direction:column;align-items:stretch;}
}

.app-signature{
  position:fixed;right:10px;bottom:8px;
  font-family:'Manrope';font-size:11px;font-weight:600;
  color:var(--ink-dim);opacity:.6;letter-spacing:.02em;
  pointer-events:none;z-index:5;
}

/* ---- navigation : boutons plus visibles avec flèches colorées ---- */
.btn-nav{
  font-family:'Manrope';font-weight:800;font-size:15px;
  border:2px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:12px;padding:10px 18px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
.btn-nav:hover{border-color:var(--accent);}
.btn-nav:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.nav-arrow{font-weight:900;font-size:1.3em;line-height:1;display:inline-block;}
.nav-arrow.back{color:var(--accent);}
.nav-arrow.fwd{color:var(--accent2);}
.btn-nav.fwd{border-color:var(--accent2);}

.match-side{flex:1;min-width:0;text-align:center;padding:6px;}
.match-side .players{font-weight:700;font-size:14px;line-height:1.5;}
.match-vs{font-family:'Oswald';font-weight:700;color:var(--ink-dim);padding:0 8px;}
.court-badge{display:inline-flex;align-items:center;gap:6px;font-family:'Oswald';font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-dim);background:var(--surface-2);border-radius:999px;padding:3px 10px;}

.timer-display{font-family:'Oswald';font-size:clamp(96px,24vw,280px);font-weight:700;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.02em;line-height:1;}
.timer-display.done{color:var(--danger);}
.timer-wrap{text-align:center;}
.timer-display.small{font-size:52px;}
.lock-note{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-dim);font-size:13px;font-weight:700;}

.absent-row{opacity:.55;}
.absent-row .chip.absent{background:var(--danger);}

.toggle-btn{
  font-family:'Manrope';font-weight:700;font-size:12px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink-dim);
  border-radius:999px;padding:7px 12px;cursor:pointer;margin-top:6px;width:100%;
}
.toggle-btn.active{background:var(--good);border-color:var(--good);color:#fff;}

</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <img src="logo.png" alt="Basket N'EPS" class="brand-logo">
      <h1 class="sr-only">TirScore</h1>
    </div>
    <div class="btn-row" id="topbar-actions"></div>
  </div>
  <div id="screen"><div class="empty">Chargement…</div></div>
</div>
<div class="app-signature">By Hugo Bredin &amp; Quentin Delisle</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';

var TEAM_COLORS = [
  {id:'noir', label:'Noir', hex:'#1c1d1f', text:'#ffffff'},
  {id:'rouge', label:'Rouge', hex:'#df3b3f', text:'#ffffff'},
  {id:'vert', label:'Vert', hex:'#2f9e44', text:'#ffffff'},
  {id:'jaune', label:'Jaune', hex:'#f0c419', text:'#1c1d1f'},
  {id:'bleu-fonce', label:'Bleu foncé', hex:'#173d8c', text:'#ffffff'},
  {id:'bleu-ciel', label:'Bleu ciel', hex:'#5bc0e8', text:'#0c2733'},
  {id:'orange', label:'Orange', hex:'#e0710c', text:'#ffffff'},
  {id:'blanc', label:'Blanc', hex:'#ffffff', text:'#1c1d1f', border:true},
  {id:'violet', label:'Violet', hex:'#8b5cf6', text:'#ffffff'}
];
function swatchStyle(c){
  var text = c.text || '#ffffff';
  var border = c.border ? 'border:2px solid var(--ink-dim);' : '';
  return 'background:'+c.hex+';color:'+text+';'+border;
}

var state = {
  db: null,
  dbReady: false,
  view: 'home',
  classes: [],
  config: {activeClassId:null, activeSeanceId:null},
  subscribedClassId: null,
  teams: [],
  students: [],
  seances: [],
  tirs: [],
  matches: [],
  absences: [],
  adminClassId: null,
  adminTab: 'equipes',
  student: {teamId:null, studentId:null},
  saisieSerie: null,
  saisieValue: 0,
  msg: null,
  profSeanceFilter: null,
  classementScope: 'all',
  classementResult: null,
  classementTirScope: 'all',
  classementTirResult: null,
  classementGeneralScope: 'all',
  classementGeneralResult: null,
  matchForm: {seanceId:null, teamA:null, teamB:null, scoreA:0, scoreB:0, scorersA:false, scorersB:false, editingId:null},
  tournamentForm: {seanceId:null, courts:1},
  roundEntry: {},
  roundTimer: {duration:480, remaining:480, running:false, ended:false, forRound:null},
  eleveMatchMsg: null
};

var unsubs = {};
var roundTimerHandle = null;
function watch(key, colPath, cb){
  if (unsubs[key]) { unsubs[key](); delete unsubs[key]; }
  if (!colPath || !state.db) { cb([]); return; }
  try{
    unsubs[key] = state.db.collection(colPath).onSnapshot(
      function(snap){
        var list = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        cb(list);
      },
      function(err){ console.error('watch', key, err); }
    );
  }catch(e){ console.error('watch build', key, e); cb([]); }
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtNum(v){
  var num = Number(v);
  var dec = (num % 1 !== 0) ? 1 : 0;
  return num.toFixed(dec).replace('.', ',');
}
function colorOf(colorId){
  return TEAM_COLORS.find(function(c){return c.id===colorId;}) || {label:colorId, hex:'#888'};
}
function teamById(id){ return state.teams.find(function(t){return t.id===id;}); }
// Couleur affichée pour une équipe : l'équipe garde son identité (élèves,
// matchs, résultats) même quand sa couleur change. teamOrId accepte soit un
// objet équipe, soit un id d'équipe (on va alors le chercher).
function colorForTeam(teamOrId){
  var t = (teamOrId && typeof teamOrId === 'object') ? teamOrId : teamById(teamOrId);
  if (!t) return colorOf(teamOrId);
  return colorOf(t.color || t.id);
}
function usedColorIds(excludeTeamId){
  return state.teams.filter(function(t){ return t.id !== excludeTeamId; }).map(function(t){ return t.color || t.id; });
}
function studentById(id){ return state.students.find(function(s){return s.id===id;}); }
function seanceById(id){ return state.seances.find(function(s){return s.id===id;}); }
function activeSeance(){ return seanceById(state.config.activeSeanceId); }
function activeClass(){ return state.classes.find(function(c){return c.id===state.config.activeClassId;}); }
function studentsOfTeam(teamId){ return state.students.filter(function(s){return s.teamId===teamId;}); }
function tirFor(seanceId, studentId){ return state.tirs.find(function(t){return t.seanceId===seanceId && t.studentId===studentId;}); }

function setView(v, extra){
  state.view = v;
  if (extra) Object.assign(state, extra);
  render();
}
function flash(text, kind){
  state.msg = {text:text, kind:kind||'info'};
  render();
  setTimeout(function(){ state.msg=null; var b=document.getElementById('flash-msg'); if(b) b.remove(); }, 3200);
}

function ensureClassSubscribed(classId){
  if (state.subscribedClassId === classId) return;
  state.subscribedClassId = classId;
  if (!classId){
    watch('teams', null, function(l){ state.teams=l; render(); });
    watch('students', null, function(l){ state.students=l; render(); });
    watch('seances', null, function(l){ state.seances=l; render(); });
    watch('tirs', null, function(l){ state.tirs=l; render(); });
    watch('matches', null, function(l){ state.matches=l; render(); });
    watch('absences', null, function(l){ state.absences=l; render(); });
    return;
  }
  watch('teams', 'classes/'+classId+'/teams', function(l){ state.teams=l; render(); });
  watch('students', 'classes/'+classId+'/students', function(l){ state.students=l; render(); });
  watch('seances', 'classes/'+classId+'/seances', function(l){ state.seances=l; render(); });
  watch('tirs', 'classes/'+classId+'/tirs', function(l){ state.tirs=l; render(); });
  watch('matches', 'classes/'+classId+'/matches', function(l){ state.matches=l; render(); });
  watch('absences', 'classes/'+classId+'/absences', function(l){ state.absences=l; render(); });
}
function isAbsent(seanceId, studentId){
  return state.absences.some(function(a){ return a.seanceId===seanceId && a.studentId===studentId; });
}

// ---------- stockage local (hors Claude : GitHub Pages, usage hors-ligne) ----------
// Implémente le même sous-ensemble d'API que la capability "db" de Claude
// (doc/collection/get/set/update/delete/onSnapshot/where), mais persiste
// dans localStorage sur l'appareil. Utilisé automatiquement quand l'app
// tourne en dehors d'un artifact Claude (window.claude absent).
function LocalDb(){
  var STORAGE_KEY = 'tirscore-data-v1';
  var store = {};
  var listeners = {};

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) store = JSON.parse(raw) || {};
    }catch(e){ console.error('LocalDb load', e); store = {}; }
  }
  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }catch(e){ console.error('LocalDb persist', e); }
  }
  load();

  function collectionDocs(colPath){
    var col = store[colPath] || {};
    return Object.keys(col).map(function(id){ return {id:id, data:col[id]}; });
  }
  function makeSnapshot(id, data){
    return {
      id:id, exists: data !== undefined,
      data: function(){ return data; },
      metadata:{fromCache:false, hasPendingWrites:false}
    };
  }
  function notifyCollection(colPath){
    (listeners[colPath] || []).forEach(function(cb){ cb(collectionDocs(colPath)); });
  }
  function notifyDoc(colPath, id){
    var key = colPath+'::doc::'+id;
    (listeners[key] || []).forEach(function(cb){ cb(); });
  }

  function docRef(path){
    var parts = path.split('/').filter(Boolean);
    var id = parts[parts.length-1];
    var colPath = parts.slice(0,-1).join('/');
    return {
      id:id, path:path,
      get: function(){
        var col = store[colPath] || {};
        return Promise.resolve(makeSnapshot(id, col[id]));
      },
      set: function(data){
        if (!store[colPath]) store[colPath] = {};
        store[colPath][id] = JSON.parse(JSON.stringify(data));
        persist(); notifyCollection(colPath); notifyDoc(colPath, id);
        return Promise.resolve();
      },
      update: function(data){
        if (!store[colPath] || store[colPath][id] === undefined){
          return Promise.reject({code:'invalid_argument', message:'Document introuvable'});
        }
        Object.assign(store[colPath][id], JSON.parse(JSON.stringify(data)));
        persist(); notifyCollection(colPath); notifyDoc(colPath, id);
        return Promise.resolve();
      },
      delete: function(){
        if (store[colPath]) delete store[colPath][id];
        persist(); notifyCollection(colPath); notifyDoc(colPath, id);
        return Promise.resolve();
      },
      onSnapshot: function(next){
        var key = colPath+'::doc::'+id;
        if (!listeners[key]) listeners[key] = [];
        var cb = function(){
          var col = store[colPath] || {};
          next(makeSnapshot(id, col[id]));
        };
        listeners[key].push(cb);
        cb();
        return function(){
          var arr = listeners[key]; var i = arr.indexOf(cb);
          if (i>-1) arr.splice(i,1);
        };
      }
    };
  }

  function queryRef(colPath, filters){
    filters = filters || [];
    function applyFilters(raw){
      return raw.filter(function(d){
        return filters.every(function(f){
          var v = d.data ? d.data[f.field] : undefined;
          return f.op === '==' ? v === f.value : true;
        });
      });
    }
    return {
      path: colPath,
      where: function(field, op, value){ return queryRef(colPath, filters.concat([{field:field, op:op, value:value}])); },
      get: function(){
        var docsOut = applyFilters(collectionDocs(colPath)).map(function(d){ return makeSnapshot(d.id, d.data); });
        return Promise.resolve({docs:docsOut, size:docsOut.length, empty:docsOut.length===0});
      },
      onSnapshot: function(next){
        var cb = function(raw){
          var docsOut = applyFilters(raw).map(function(d){ return makeSnapshot(d.id, d.data); });
          next({docs:docsOut, size:docsOut.length, empty:docsOut.length===0, docChanges:function(){return [];}});
        };
        if (!listeners[colPath]) listeners[colPath] = [];
        listeners[colPath].push(cb);
        cb(collectionDocs(colPath));
        return function(){
          var arr = listeners[colPath]; var i = arr.indexOf(cb);
          if (i>-1) arr.splice(i,1);
        };
      },
      doc: function(id){
        id = id || genId();
        return docRef(colPath+'/'+id);
      },
      add: function(data){
        var ref = docRef(colPath+'/'+genId());
        return ref.set(data).then(function(){ return ref; });
      }
    };
  }

  return {
    doc: function(path){ return docRef(path); },
    collection: function(path){ return queryRef(path, []); }
  };
}

// Équivalent local du téléchargement (capability "downloads" de Claude) :
// déclenche un téléchargement de fichier classique dans le navigateur.
var localDownloads = {
  save: function(req){
    return new Promise(function(resolve, reject){
      try{
        var blob = req.data instanceof Blob ? req.data : new Blob([req.data], {type:'application/octet-stream'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = req.filename || 'export';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        resolve({status:'saved'});
      }catch(e){ reject(e); }
    });
  }
};
function getDb(){
  if (window.claude && window.claude.use){
    return window.claude.use('db').then(function(db){ return db || new LocalDb(); }).catch(function(){ return new LocalDb(); });
  }
  return Promise.resolve(new LocalDb());
}
function getDownloads(){
  if (window.claude && window.claude.use){
    return window.claude.use('downloads').then(function(d){ return d || localDownloads; }).catch(function(){ return localDownloads; });
  }
  return Promise.resolve(localDownloads);
}

// ---------- init ----------
function init(){
  render();
  getDb().then(function(db){
    state.db = db;
    state.dbReady = true;
    db.doc('app/config').onSnapshot(function(snap){
      state.config = snap.exists ? Object.assign({activeClassId:null, activeSeanceId:null}, snap.data()) : {activeClassId:null, activeSeanceId:null};
      render();
    }, function(err){ console.error('config', err); });
    db.collection('classes').onSnapshot(function(snap){
      state.classes = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(err){ console.error('classes', err); });
    render();
  });
}

function currentRoundMatches(){

  if (!scheduled.length) return null;

  var list = scheduled.filter(function(m){ return (m.round||1)===minRound; })

}

    state.roundTimer.remaining = state.roundTimer.duration;

}

function generateRoundRobinPairs(teamIds){
  var arr = teamIds.slice();
  if (arr.length % 2 === 1) arr.push(null);
  var n = arr.length;
  var rounds = [];
  for (var r = 0; r < n - 1; r++){
    var pairs = [];
    for (var i = 0; i < n/2; i++){
      var a = arr[i], b = arr[n-1-i];
      if (a != null && b != null) pairs.push([a,b]);
    }
    rounds.push(pairs);
    var fixed = arr[0];
    var rest = arr.slice(1);
    rest.unshift(rest.pop());
    arr = [fixed].concat(rest);
  }
  return rounds;
}

function computeRanking(scopeSeanceId){
  var matches = state.matches.filter(function(m){
    return (!scopeSeanceId || m.seanceId===scopeSeanceId) && m.scoreA != null && m.scoreB != null;
  });
  var stats = {};
  state.teams.forEach(function(t){ stats[t.id] = {teamId:t.id, played:0, wins:0, draws:0, losses:0, goalPos:0}; });
  matches.forEach(function(m){
    if (!stats[m.teamAId] || !stats[m.teamBId]) return;
    var a = stats[m.teamAId], b = stats[m.teamBId];
    a.played++; b.played++;
    var diff = m.scoreA - m.scoreB;
    if (diff > 0) { a.wins++; b.losses++; }
    else if (diff < 0) { b.wins++; a.losses++; }
    else { a.draws++; b.draws++; }
    a.goalPos += Math.max(0, diff);
    b.goalPos += Math.max(0, -diff);
  });
  var maxPlayed = Object.values(stats).reduce(function(m,s){ return Math.max(m, s.played); }, 0);
  var list = Object.values(stats).map(function(s){
    var coef = s.played > 0 ? (maxPlayed / s.played) : 0;
    return Object.assign({}, s, {
      coef: coef,
      adjPoints: s.wins * coef,
      adjGoal: s.goalPos * coef
    });
  });
  list.sort(function(a,b){
    if (b.adjPoints !== a.adjPoints) return b.adjPoints - a.adjPoints;
    if (b.adjGoal !== a.adjGoal) return b.adjGoal - a.adjGoal;
    return colorForTeam(a.teamId).label.localeCompare(colorForTeam(b.teamId).label);
  });
  return {maxPlayed: maxPlayed, list: list};
}

function computeTirRanking(scopeSeanceId){
  var tirs = state.tirs.filter(function(t){ return !scopeSeanceId || t.seanceId===scopeSeanceId; });
  var byStudent = {};
  state.students.forEach(function(s){ byStudent[s.id] = {studentId:s.id, teamId:s.teamId, values:[]}; });
  var byTeam = {};
  state.teams.forEach(function(t){ byTeam[t.id] = {teamId:t.id, values:[]}; });
  tirs.forEach(function(t){
    var vals = [];
    if (t.serie1 != null) vals.push(t.serie1);
    if (t.serie2 != null) vals.push(t.serie2);
    if (!vals.length) return;
    if (byStudent[t.studentId]) byStudent[t.studentId].values = byStudent[t.studentId].values.concat(vals);
    if (byTeam[t.teamId]) byTeam[t.teamId].values = byTeam[t.teamId].values.concat(vals);
  });
  function toStats(obj, extra){
    return Object.keys(obj).map(function(k){
      var e = obj[k];
      var n = e.values.length;
      var avg = n ? e.values.reduce(function(a,b){return a+b;},0)/n : null;
      var best = n ? Math.max.apply(null, e.values) : null;
      return Object.assign({}, e, extra, {n:n, avg:avg, best:best});
    });
  }
  var students = toStats(byStudent).filter(function(s){ return s.n > 0; });
  var teams = toStats(byTeam).filter(function(s){ return s.n > 0; });
  function cmp(a, b){
    if (b.avg !== a.avg) return b.avg - a.avg;
    if (b.best !== a.best) return b.best - a.best;
    return 0;
  }
  students.sort(function(a,b){
    var c = cmp(a,b); if (c) return c;
    var sa = studentById(a.studentId), sb = studentById(b.studentId);
    return (sa?sa.firstName:'').localeCompare(sb?sb.firstName:'');
  });
  teams.sort(function(a,b){
    var c = cmp(a,b); if (c) return c;
    return colorForTeam(a.teamId).label.localeCompare(colorForTeam(b.teamId).label);
  });
  return {students: students, teams: teams};
}

// ---- classement général (points cumulés tir + matchs, par leçon et sur le cycle) ----
// Points matchs (par ronde, pour chaque équipe) : victoire (5 pts si 3 marqueurs
// différents, sinon 4) / égalité (3 pts si 3 marqueurs différents, sinon 2) /
// défaite (3 pts si 3 marqueurs différents, sinon 1).
var MATCH_POINTS_TABLE = {
  win:  {three:5, normal:4},
  draw: {three:3, normal:2},
  loss: {three:3, normal:1}
};
function matchPointsFor(result, hasThree){
  return MATCH_POINTS_TABLE[result][hasThree ? 'three' : 'normal'];
}
// Points de la série de tir pour une leçon donnée : les équipes sont classées
// sur leur total de points pondéré (pour ne pas pénaliser une équipe à
// l'effectif réduit — équipe à 3, ou élève absent — son total est ramené à
// l'équivalent du nombre de tireurs le plus élevé parmi les équipes de la
// leçon), puis reçoivent n-1, n-2, ... 0 points selon leur rang (n = nombre
// d'équipes).
function tirPointsForSeance(seanceId){
  var teams = state.teams;
  var perTeam = teams.map(function(t){
    var studentIds = studentsOfTeam(t.id).map(function(s){ return s.id; });
    var shooters = 0, rawTotal = 0;
    state.tirs.forEach(function(tir){
      if (tir.seanceId !== seanceId || studentIds.indexOf(tir.studentId) === -1) return;
      var has = false;
      if (tir.serie1 != null) { rawTotal += tir.serie1; has = true; }
      if (tir.serie2 != null) { rawTotal += tir.serie2; has = true; }
      if (has) shooters++;
    });
    return {teamId: t.id, shooters: shooters, rawTotal: rawTotal};
  });
  var maxShooters = perTeam.reduce(function(m, r){ return Math.max(m, r.shooters); }, 0);
  perTeam.forEach(function(r){
    r.weighted = (r.shooters > 0 && maxShooters > 0) ? r.rawTotal * (maxShooters / r.shooters) : 0;
  });
  perTeam.sort(function(a, b){
    if (b.weighted !== a.weighted) return b.weighted - a.weighted;
    return colorForTeam(a.teamId).label.localeCompare(colorForTeam(b.teamId).label);
  });
  var n = perTeam.length;
  var points = {};
  perTeam.forEach(function(r, i){ points[r.teamId] = {points: Math.max(0, n - 1 - i), weighted: r.weighted, shooters: r.shooters}; });
  return points;
}
function matchPointsForSeance(seanceId){
  var points = {};
  state.teams.forEach(function(t){ points[t.id] = 0; });
  state.matches.forEach(function(m){
    if (m.seanceId !== seanceId || m.scoreA == null || m.scoreB == null) return;
    var diff = m.scoreA - m.scoreB;
    var resultA = diff > 0 ? 'win' : (diff < 0 ? 'loss' : 'draw');
    var resultB = diff > 0 ? 'loss' : (diff < 0 ? 'win' : 'draw');
    if (points[m.teamAId] != null) points[m.teamAId] += matchPointsFor(resultA, !!m.scorersA3);
    if (points[m.teamBId] != null) points[m.teamBId] += matchPointsFor(resultB, !!m.scorersB3);
  });
  return points;
}
function computeGeneralRanking(scopeSeanceId){
  var seances = scopeSeanceId ? state.seances.filter(function(s){ return s.id===scopeSeanceId; }) : state.seances;
  var totals = {};
  state.teams.forEach(function(t){ totals[t.id] = {teamId:t.id, tirPoints:0, matchPoints:0}; });
  var bySeance = seances.map(function(sea){
    var tirPts = tirPointsForSeance(sea.id);
    var matchPts = matchPointsForSeance(sea.id);
    state.teams.forEach(function(t){
      var tp = (tirPts[t.id] && tirPts[t.id].points) || 0;
      var mp = matchPts[t.id] || 0;
      totals[t.id].tirPoints += tp;
      totals[t.id].matchPoints += mp;
    });
    return {seance: sea, tirPts: tirPts, matchPts: matchPts};
  });
  var list = Object.values(totals).map(function(t){
    return Object.assign({}, t, {total: t.tirPoints + t.matchPoints});
  });
  list.sort(function(a, b){
    if (b.total !== a.total) return b.total - a.total;
    return colorForTeam(a.teamId).label.localeCompare(colorForTeam(b.teamId).label);
  });
  return {list: list, bySeance: bySeance, scopeSeanceId: scopeSeanceId};
}

        '<td><span class="chip" style="'+swatchStyle(c)+'">'+esc(c.label)+'</span></td>' +
        '<td>'+r.n+'</td><td>'+fmtNum(r.avg, step)+'</td><td>'+fmtNum(r.best, step)+'</td></tr>';
    }).join('') || '<tr><td colspan="6" class="empty">Aucun résultat.</td></tr>';
    var teamRows = res.teams.map(function(r, i){
      var c = colorForTeam(r.teamId);
      return '<tr class="'+(i===0?'rank-1':'')+'"><td>'+(i+1)+'</td>' +
        '<td><span class="chip" style="'+swatchStyle(c)+'">'+esc(c.label)+'</span></td>' +

  }
  return (
    '<div class="stack">' +
      '<div class="row">' +

// ---------- render dispatch ----------
function render(){
  renderTopbarActions();
  var screen = document.getElementById('screen');
  var html;
  switch(state.view){
    case 'nodb': html = renderNoDb(); break;
    case 'home': html = renderHome(); break;
    case 'eleve-home': html = renderEleveHome(); break;
    case 'eleve-equipe': html = renderEleveEquipe(); break;
    case 'eleve-prenom': html = renderElevePrenom(); break;
    case 'eleve-fiche': html = renderEleveFiche(); break;
    case 'eleve-saisie': html = renderEleveSaisie(); break;
    case 'eleve-matchs': html = renderEleveMatchs(); break;
    case 'prof': html = renderProf(); break;
    default: html = renderHome();
  }
  if (state.msg){
    html = '<div id="flash-msg" class="banner '+(state.msg.kind==='error'?'warn':'info')+'" style="margin-bottom:14px">'+esc(state.msg.text)+'</div>' + html;
  }
  screen.innerHTML = html;
  wireDynamic();
}

function wireDynamic(){
  var slider = document.getElementById('score-slider');
  if (slider){
    slider.addEventListener('input', function(){
      state.saisieValue = parseFloat(slider.value);
      var disp = document.getElementById('slider-display');
      if (disp) disp.textContent = fmtNum(state.saisieValue);
    });
  }
  var scoreASlider = document.getElementById('match-scoreA');
  if (scoreASlider){
    scoreASlider.addEventListener('input', function(){
      state.matchForm.scoreA = parseFloat(scoreASlider.value);
      var disp = document.getElementById('match-scoreA-display');
      if (disp) disp.textContent = fmtNum(state.matchForm.scoreA);
    });
  }
  var scoreBSlider = document.getElementById('match-scoreB');
  if (scoreBSlider){
    scoreBSlider.addEventListener('input', function(){
      state.matchForm.scoreB = parseFloat(scoreBSlider.value);
      var disp = document.getElementById('match-scoreB-display');
      if (disp) disp.textContent = fmtNum(state.matchForm.scoreB);
    });
  }
  var rdSliders = document.querySelectorAll('.rd-score');
  for (var i=0; i<rdSliders.length; i++){
    (function(sl){
      sl.addEventListener('input', function(){
        var id = sl.getAttribute('data-id'), side = sl.getAttribute('data-side');
        if (!state.roundEntry[id]) state.roundEntry[id] = {scoreA:0, scoreB:0, scorersA:false, scorersB:false};
        state.roundEntry[id]['score'+side] = parseFloat(sl.value);
        var disp = document.getElementById('rd-score'+side+'-disp-'+id);
        if (disp) disp.textContent = fmtNum(state.roundEntry[id]['score'+side]);
      });
    })(rdSliders[i]);
  }
}

// ---------- actions ----------
function genId(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function handleAction(action, el){
  var db = state.db;
  switch(action){
    case 'go-home': setView('home'); break;
    case 'go-eleve':
      ensureClassSubscribed(state.config.activeClassId);
      setView('eleve-home');
      break;
    case 'go-eleve-precision':
      ensureClassSubscribed(state.config.activeClassId);
      setView('eleve-equipe', {student:{teamId:null, studentId:null}});
      break;
    case 'go-prof':
      if (!state.adminClassId && state.classes.length) state.adminClassId = state.config.activeClassId || state.classes[0].id;
      ensureClassSubscribed(state.adminClassId);
      setView('prof');
      break;
    case 'pick-team':
      state.student.teamId = el.getAttribute('data-id');
      setView('eleve-prenom');
      break;
    case 'pick-student':
      state.student.studentId = el.getAttribute('data-id');
      setView('eleve-fiche');
      break;
    case 'start-saisie':
      state.saisieSerie = parseInt(el.getAttribute('data-serie'), 10);
      var sea = activeSeance();
      state.saisieValue = sea && sea.tirMin != null ? sea.tirMin + (sea.tirMax - sea.tirMin) / 2 : 5;
      setView('eleve-saisie');
      break;
    case 'cancel-saisie': setView('eleve-fiche'); break;
    case 'valider-saisie': validerSaisie(); break;
    case 'go-eleve-matchs':
      ensureClassSubscribed(state.config.activeClassId);
      state.roundEntry = {};
      setView('eleve-matchs');
      break;
    case 'save-round-scores': saveRoundScores(); break;
    case 'toggle-scorers3':
      var rid = el.getAttribute('data-id'), rside = el.getAttribute('data-side');
      if (!state.roundEntry[rid]) state.roundEntry[rid] = {scoreA:0, scoreB:0, scorersA:false, scorersB:false};
      state.roundEntry[rid]['scorers'+rside] = !state.roundEntry[rid]['scorers'+rside];
      render();
      break;
    case 'toggle-absence': toggleAbsence(el.getAttribute('data-seance'), el.getAttribute('data-id')); break;
    case 'timer-start': startTimer(); break;
    case 'timer-pause': pauseTimer(); break;
    case 'timer-end': endTimerNow(); break;
    case 'timer-reset': resetTimer(); break;
    case 'timer-duration':
      var mins = Math.max(1, parseInt(el.value, 10) || 8);
      state.roundTimer.duration = mins * 60;
      if (!state.roundTimer.running) state.roundTimer.remaining = state.roundTimer.duration;
      render();
      break;

    case 'prof-tab': state.adminTab = el.getAttribute('data-tab'); state.classementResult=null; state.classementTirResult=null; state.classementGeneralResult=null; render(); break;
    case 'select-admin-class':
      state.adminClassId = el.getAttribute('data-id');
      ensureClassSubscribed(state.adminClassId);
      render();
      break;
    case 'create-class': createClass(); break;
    case 'delete-class': deleteClass(el.getAttribute('data-id')); break;
    case 'set-active-class':
      db.doc('app/config').set(Object.assign({}, state.config, {activeClassId: el.getAttribute('data-id'), activeSeanceId: null}));
      flash('Classe activée pour les élèves.');
      break;

    case 'add-team': addTeam(); break;
    case 'recolor-team': recolorTeam(el.getAttribute('data-id'), el.value); break;
    case 'delete-team': deleteTeam(el.getAttribute('data-id')); break;
    case 'add-student': addStudent(el.getAttribute('data-team')); break;
    case 'delete-student': deleteStudent(el.getAttribute('data-id')); break;

    case 'create-seance': createSeance(); break;
    case 'delete-seance': deleteSeance(el.getAttribute('data-id')); break;
    case 'set-active-seance':
      db.doc('app/config').set(Object.assign({}, state.config, {activeClassId: state.adminClassId, activeSeanceId: el.getAttribute('data-id')}));
      flash('Leçon activée pour les élèves.');
      break;

    case 'filter-resultats': state.profSeanceFilter = el.value || null; render(); break;
    case 'export-csv': exportCsv(); break;
    case 'export-xlsx': exportXlsx(); break;
    case 'export-json-backup': exportJsonBackup(); break;
    case 'trigger-import': document.getElementById('backup-file-input').click(); break;
    case 'import-json-backup': importJsonBackup(el.files && el.files[0]); break;
    case 'delete-tir': db.doc('classes/'+state.adminClassId+'/tirs/'+el.getAttribute('data-id')).delete(); break;

    case 'match-field': state.matchForm[el.getAttribute('data-f')] = el.value; render(); break;
    case 'tournament-field': state.tournamentForm[el.getAttribute('data-f')] = el.value; render(); break;
    case 'add-match': addMatch(); break;
    case 'edit-match': editMatch(el.getAttribute('data-id')); break;
    case 'match-scorers-toggle':
      var mside = el.getAttribute('data-side');
      state.matchForm['scorers'+mside] = !state.matchForm['scorers'+mside];
      render();
      break;
    case 'cancel-edit-match':
      state.matchForm = {seanceId: state.matchForm.seanceId, teamA:null, teamB:null, scoreA:0, scoreB:0, scorersA:false, scorersB:false, editingId:null};
      render();
      break;
    case 'generate-schedule': generateSchedule(); break;
    case 'delete-match':
      if (confirm('Supprimer ce match ?')) db.doc('classes/'+state.adminClassId+'/matches/'+el.getAttribute('data-id')).delete();
      break;

    case 'classement-scope': state.classementScope = el.value; state.classementResult = null; render(); break;
    case 'calc-classement':
      state.classementResult = computeRanking(state.classementScope === 'all' ? null : state.classementScope);
      render();
      break;
    case 'classement-tir-scope': state.classementTirScope = el.value; state.classementTirResult = null; render(); break;
    case 'calc-classement-tir':
      state.classementTirResult = computeTirRanking(state.classementTirScope === 'all' ? null : state.classementTirScope);
      render();
      break;
    case 'classement-general-scope': state.classementGeneralScope = el.value; state.classementGeneralResult = null; render(); break;
    case 'calc-classement-general':
      state.classementGeneralResult = computeGeneralRanking(state.classementGeneralScope === 'all' ? null : state.classementGeneralScope);
      render();
      break;
  }
}

function validerSaisie(){
  var db = state.db;
  var sea = activeSeance();
  var stu = studentById(state.student.studentId);
  if (!db || !sea || !stu) return;
  var docId = sea.id + '_' + stu.id;
  var ref = db.doc('classes/'+state.config.activeClassId+'/tirs/'+docId);
  var field = 'serie' + state.saisieSerie;
  var payload = {}; payload[field] = state.saisieValue; payload['ts'+state.saisieSerie] = Date.now();
  ref.get().then(function(snap){
    if (snap.exists){
      return ref.update(payload);
    }
    var full = Object.assign({seanceId: sea.id, studentId: stu.id, teamId: stu.teamId}, payload);
    return ref.set(full);
  }).then(function(){
    flash('Score enregistré.');
    setView('eleve-fiche');
  }).catch(function(e){
    console.error(e);
    flash('Erreur lors de l\'enregistrement.', 'error');
  });
}

function saveRoundScores(){
  var cur = currentRoundMatches();
  if (!cur || !state.db) return;
  if (!state.roundTimer.ended){ flash('Attends la fin du temps (ou clique sur « Fin ») avant de saisir les scores.', 'error'); return; }
  var classId = state.config.activeClassId;
  var writes = cur.matches.map(function(m){
    var entry = state.roundEntry[m.id] || {scoreA:0, scoreB:0, scorersA:false, scorersB:false};
    return state.db.doc('classes/'+classId+'/matches/'+m.id).update({
      scoreA: Math.round(entry.scoreA)||0, scoreB: Math.round(entry.scoreB)||0,
      scorersA3: !!entry.scorersA, scorersB3: !!entry.scorersB, ts: Date.now()
    });
  });
  Promise.all(writes).then(function(){
    state.roundEntry = {};
    state.classementResult = computeRanking(null);
    state.classementGeneralResult = null;
    flash('Scores enregistrés, le classement est à jour.');
    setView('home');
  }).catch(function(e){
    console.error(e);
    flash('Erreur lors de l\'enregistrement.', 'error');
  });
}

function toggleAbsence(seanceId, studentId){
  if (!seanceId || !studentId || !state.adminClassId) return;
  var existing = state.absences.find(function(a){ return a.seanceId===seanceId && a.studentId===studentId; });
  var base = 'classes/'+state.adminClassId+'/absences';
  if (existing){
    state.db.doc(base+'/'+existing.id).delete().then(function(){ flash('Élève marqué présent·e.'); });
  } else {
    state.db.collection(base).add({seanceId: seanceId, studentId: studentId, createdAt: Date.now()})
      .then(function(){ flash('Élève marqué absent·e.'); });
  }
}

function tickTimer(){
  if (!state.roundTimer.running) return;
  state.roundTimer.remaining = Math.max(0, state.roundTimer.remaining - 1);
  var disp = document.getElementById('timer-display');
  if (disp && state.roundTimer.remaining > 0){
    disp.textContent = formatTimer(state.roundTimer.remaining);
  }
  if (state.roundTimer.remaining === 0){
    state.roundTimer.running = false;
    state.roundTimer.ended = true;
    if (roundTimerHandle){ clearInterval(roundTimerHandle); roundTimerHandle = null; }
    render();
  }
}
function startTimer(){
  if (state.roundTimer.running || state.roundTimer.ended) return;
  if (state.roundTimer.remaining <= 0) state.roundTimer.remaining = state.roundTimer.duration;
  state.roundTimer.running = true;
  roundTimerHandle = setInterval(tickTimer, 1000);
  render();
}
function pauseTimer(){
  state.roundTimer.running = false;
  if (roundTimerHandle){ clearInterval(roundTimerHandle); roundTimerHandle = null; }
  render();
}
function endTimerNow(){
  state.roundTimer.running = false;
  state.roundTimer.remaining = 0;
  state.roundTimer.ended = true;
  if (roundTimerHandle){ clearInterval(roundTimerHandle); roundTimerHandle = null; }
  render();
}
function resetTimer(){
  state.roundTimer.running = false;
  if (roundTimerHandle){ clearInterval(roundTimerHandle); roundTimerHandle = null; }
  state.roundTimer.remaining = state.roundTimer.duration;
  state.roundTimer.ended = false;
  render();
}

function createClass(){
  var input = document.getElementById('new-class-name');
  var name = input.value.trim();
  if (!name) return;
  state.db.collection('classes').add({name: name, createdAt: Date.now()}).then(function(ref){
    state.adminClassId = ref.id;
    ensureClassSubscribed(ref.id);
    render();
  });
}
function deleteCollectionDocs(path){
  return state.db.collection(path).get().then(function(snap){
    return Promise.all(snap.docs.map(function(d){ return state.db.doc(path+'/'+d.id).delete(); }));
  });
}
function deleteClass(id){
  if (!confirm('Supprimer cette classe et toutes ses données (équipes, élèves, leçons, résultats, matchs) ?')) return;
  var base = 'classes/'+id;
  Promise.all([
    deleteCollectionDocs(base+'/teams'),
    deleteCollectionDocs(base+'/students'),
    deleteCollectionDocs(base+'/seances'),
    deleteCollectionDocs(base+'/tirs'),
    deleteCollectionDocs(base+'/matches'),
    deleteCollectionDocs(base+'/absences')
  ]).then(function(){
    return state.db.doc(base).delete();
  }).catch(function(e){ console.error(e); });
  if (state.adminClassId === id) state.adminClassId = null;
  if (state.config.activeClassId === id){
    state.db.doc('app/config').set({activeClassId:null, activeSeanceId:null});
  }
}

function addTeam(){
  var used = usedColorIds(null);
  var free = TEAM_COLORS.find(function(c){ return used.indexOf(c.id) === -1; });
  if (!free){ flash('Les 9 couleurs sont déjà utilisées.', 'error'); return; }
  state.db.collection('classes/'+state.adminClassId+'/teams').add({color: free.id, createdAt: Date.now()});
}
function recolorTeam(teamId, newColorId){
  var t = teamById(teamId);
  if (!t) return;
  var oldColorId = t.color || t.id;
  if (oldColorId === newColorId) return;
  var swapWith = state.teams.find(function(other){ return other.id !== teamId && (other.color || other.id) === newColorId; });
  var base = 'classes/'+state.adminClassId+'/teams/';
  function bodyWithColor(team, colorId){
    var b = Object.assign({}, team);
    delete b.id;
    b.color = colorId;
    return b;
  }
  var writes = [ state.db.doc(base+teamId).set(bodyWithColor(t, newColorId)) ];
  if (swapWith){
    writes.push(state.db.doc(base+swapWith.id).set(bodyWithColor(swapWith, oldColorId)));
  }
  Promise.all(writes).then(function(){
    flash(swapWith ? 'Couleurs échangées.' : 'Couleur mise à jour.');
  });
}
function deleteTeam(teamId){
  var t = teamById(teamId);
  if (!t) return;
  var students = studentsOfTeam(teamId);
  var relatedMatches = state.matches.filter(function(m){ return m.teamAId===teamId || m.teamBId===teamId; });
  var relatedTirs = state.tirs.filter(function(tir){ return tir.teamId===teamId; });
  var studentIds = students.map(function(s){ return s.id; });
  var relatedAbsences = state.absences.filter(function(a){ return studentIds.indexOf(a.studentId) !== -1; });
  var warnParts = [];
  if (students.length) warnParts.push(students.length+' élève(s)');
  if (relatedMatches.length) warnParts.push(relatedMatches.length+' match(s)');
  if (relatedTirs.length) warnParts.push(relatedTirs.length+' résultat(s) de tir');
  var msg = 'Supprimer cette équipe ?' + (warnParts.length ? ' Cela supprimera aussi : '+warnParts.join(', ')+'.' : '');
  if (!confirm(msg)) return;
  var base = 'classes/'+state.adminClassId;
  Promise.all(
    students.map(function(s){ return state.db.doc(base+'/students/'+s.id).delete(); })
    .concat(relatedMatches.map(function(m){ return state.db.doc(base+'/matches/'+m.id).delete(); }))
    .concat(relatedTirs.map(function(tir){ return state.db.doc(base+'/tirs/'+tir.id).delete(); }))
    .concat(relatedAbsences.map(function(a){ return state.db.doc(base+'/absences/'+a.id).delete(); }))
  ).then(function(){
    return state.db.doc(base+'/teams/'+teamId).delete();
  }).then(function(){
    flash('Équipe supprimée.');
  });
}
function addStudent(teamId){
  var input = document.getElementById('new-student-'+teamId);
  var name = input.value.trim();
  if (!name) return;
  state.db.collection('classes/'+state.adminClassId+'/students').add({firstName: name, teamId: teamId, createdAt: Date.now()});
  input.value = '';
}

function createSeance(){
  var label = document.getElementById('new-seance-label').value.trim() || ('Leçon du ' + document.getElementById('new-seance-date').value);
  var date = document.getElementById('new-seance-date').value;
  var min = Math.round(parseFloat(document.getElementById('new-seance-min').value));
  var max = Math.round(parseFloat(document.getElementById('new-seance-max').value));
  state.db.collection('classes/'+state.adminClassId+'/seances').add({
    label: label, date: date, tirMin: min, tirMax: max, tirStep: 1, createdAt: Date.now()
  }).then(function(ref){
    state.db.doc('app/config').set(Object.assign({}, state.config, {activeClassId: state.adminClassId, activeSeanceId: ref.id}));
    flash('Leçon créée et activée.');
  });
}
function deleteStudent(studentId){
  if (!studentId || !state.adminClassId) return;
  var base = 'classes/'+state.adminClassId;
  var relatedAbsences = state.absences.filter(function(a){ return a.studentId===studentId; });
  Promise.all(relatedAbsences.map(function(a){ return state.db.doc(base+'/absences/'+a.id).delete(); }))
    .then(function(){ return state.db.doc(base+'/students/'+studentId).delete(); });
}
function deleteSeance(id){
  if (!confirm('Supprimer cette leçon ainsi que ses résultats de tir et ses matchs ?')) return;
  var base = 'classes/'+state.adminClassId;
  Promise.all([
    state.db.collection(base+'/tirs').where('seanceId','==',id).get().then(function(snap){
      return Promise.all(snap.docs.map(function(d){ return state.db.doc(base+'/tirs/'+d.id).delete(); }));
    }),
    state.db.collection(base+'/matches').where('seanceId','==',id).get().then(function(snap){
      return Promise.all(snap.docs.map(function(d){ return state.db.doc(base+'/matches/'+d.id).delete(); }));
    }),
    state.db.collection(base+'/absences').where('seanceId','==',id).get().then(function(snap){
      return Promise.all(snap.docs.map(function(d){ return state.db.doc(base+'/absences/'+d.id).delete(); }));
    })
  ]).then(function(){
    return state.db.doc(base+'/seances/'+id).delete();
  }).then(function(){
    if (state.config.activeSeanceId === id){
      state.db.doc('app/config').set(Object.assign({}, state.config, {activeSeanceId:null}));
    }
  }).catch(function(e){ console.error(e); });
}

function addMatch(){
  var f = state.matchForm;
  if (!f.editingId) return;
  var scoreA = parseFloat(document.getElementById('match-scoreA').value) || 0;
  var scoreB = parseFloat(document.getElementById('match-scoreB').value) || 0;
  state.db.doc('classes/'+state.adminClassId+'/matches/'+f.editingId).update({
    scoreA: scoreA, scoreB: scoreB, scorersA3: !!f.scorersA, scorersB3: !!f.scorersB, ts: Date.now()
  }).then(function(){
    flash('Score corrigé.');
    state.matchForm = {seanceId: f.seanceId, teamA:null, teamB:null, scoreA:0, scoreB:0, scorersA:false, scorersB:false, editingId:null};
    state.classementGeneralResult = null;
    render();
  });
}

function editMatch(matchId){
  var m = state.matches.find(function(x){return x.id===matchId;});
  if (!m) return;
  state.matchForm = {
    seanceId: m.seanceId, teamA: m.teamAId, teamB: m.teamBId,
    scoreA: m.scoreA != null ? m.scoreA : 0, scoreB: m.scoreB != null ? m.scoreB : 0,
    scorersA: !!m.scorersA3, scorersB: !!m.scorersB3,
    editingId: matchId
  };
  render();
}

function generateSchedule(){
  var tf = state.tournamentForm;
  var courts = Math.max(1, parseInt(document.getElementById('tournament-courts').value, 10) || 1);
  var teamIds = state.teams.map(function(t){return t.id;});
  if (teamIds.length < 2){ flash('Il faut au moins deux équipes.', 'error'); return; }
  var existingScheduled = state.matches.filter(function(m){ return m.seanceId===tf.seanceId && m.scoreA == null; });
  var doGenerate = function(){
    var rounds = generateRoundRobinPairs(teamIds);
    var writes = [];
    rounds.forEach(function(pairs, ri){
      pairs.forEach(function(pair, pi){
        var slot = Math.floor(pi / courts) + 1;
        writes.push(state.db.collection('classes/'+state.adminClassId+'/matches').add({
          seanceId: tf.seanceId, teamAId: pair[0], teamBId: pair[1],
          scoreA: null, scoreB: null, scorersA3: false, scorersB3: false, round: ri+1, slot: slot, ts: Date.now()
        }));
      });
    });
    Promise.all(writes).then(function(){
      flash('Programme généré : '+writes.length+' match(s) sur '+rounds.length+' ronde(s).');
    });
  };
  if (existingScheduled.length){
    if (!confirm('Un programme non joué existe déjà pour cette leçon ('+existingScheduled.length+' match(s) à jouer). Le remplacer ?')) return;
    Promise.all(existingScheduled.map(function(m){
      return state.db.doc('classes/'+state.adminClassId+'/matches/'+m.id).delete();
    })).then(doGenerate);
  } else {
    doGenerate();
  }
}

function exportCsv(){
  var filterId = state.profSeanceFilter;
  var tirs = state.tirs.filter(function(t){ return !filterId || t.seanceId===filterId; });
  var lines = ['Leçon;Équipe;Élève;Série 1;Série 2'];
  tirs.forEach(function(t){
    var stu = studentById(t.studentId);
    var sea = seanceById(t.seanceId);
    if (!stu || !sea) return;
    lines.push([sea.label, colorForTeam(t.teamId).label, stu.firstName, t.serie1!=null?t.serie1:'', t.serie2!=null?t.serie2:''].join(';'));
  });
  var csv = lines.join('\n');
  getDownloads().then(function(d){
    d.save({filename:'tirscore-resultats.csv', data: csv}).catch(function(){});
  });
}

function exportXlsx(){
  if (!window.XLSX){ flash('La bibliothèque Excel n\'a pas pu se charger.', 'error'); return; }
  var filterId = state.profSeanceFilter;
  var tirs = state.tirs.filter(function(t){ return !filterId || t.seanceId===filterId; });

  var resultRows = [['Leçon','Date','Équipe','Élève','Série 1','Série 2']];
  tirs.forEach(function(t){
    var stu = studentById(t.studentId);
    var sea = seanceById(t.seanceId);
    if (!stu || !sea) return;
    resultRows.push([sea.label, sea.date||'', colorForTeam(t.teamId).label, stu.firstName,
      t.serie1!=null?t.serie1:'', t.serie2!=null?t.serie2:'']);
  });

  var matchRows = [['Leçon','Ronde','Équipe A','Score A','Score B','Équipe B','Statut']];
  state.matches.slice().sort(function(a,b){return (a.round||0)-(b.round||0) || (a.ts||0)-(b.ts||0);}).forEach(function(m){
    var sea = seanceById(m.seanceId);
    var played = m.scoreA != null;
    matchRows.push([sea?sea.label:'', m.round||'', colorForTeam(m.teamAId).label,
      played?m.scoreA:'', played?m.scoreB:'', colorForTeam(m.teamBId).label, played?'joué':'à jouer']);
  });

  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resultRows), 'Résultats tir');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(matchRows), 'Matchs');
  if (state.classementResult){
    var rankRows = [['Rang','Équipe','Matchs joués','Victoires','Nuls','Défaites','Coefficient','Points ajustés','Goal average positif ajusté']];
    state.classementResult.list.forEach(function(r, i){
      rankRows.push([i+1, colorForTeam(r.teamId).label, r.played, r.wins, r.draws, r.losses,
        Number(r.coef.toFixed(2)), Number(r.adjPoints.toFixed(2)), Number(r.adjGoal.toFixed(2))]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rankRows), 'Classement matchs');
  }
  if (state.classementTirResult){
    var stuRows = [['Rang','Élève','Équipe','Séries','Moyenne','Meilleure série']];
    state.classementTirResult.students.forEach(function(r, i){
      var stu = studentById(r.studentId);
      stuRows.push([i+1, stu?stu.firstName:'', colorForTeam(r.teamId).label, r.n, Number(r.avg.toFixed(2)), r.best]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(stuRows), 'Classement précision élèves');
    var teamPrecRows = [['Rang','Équipe','Séries','Moyenne','Meilleure série']];
    state.classementTirResult.teams.forEach(function(r, i){
      teamPrecRows.push([i+1, colorForTeam(r.teamId).label, r.n, Number(r.avg.toFixed(2)), r.best]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(teamPrecRows), 'Classement précision équipes');
  }

  var wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  var blob = new Blob([wbout], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  getDownloads().then(function(d){
    d.save({filename:'tirscore-resultats.xlsx', data: blob}).catch(function(){});
  });
}

function exportJsonBackup(){
  if (!state.db){ flash('Stockage indisponible.', 'error'); return; }
  var db = state.db;
  db.collection('classes').get().then(function(snap){
    var classes = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    return Promise.all(classes.map(function(c){
      var base = 'classes/'+c.id;
      return Promise.all([
        db.collection(base+'/teams').get(),
        db.collection(base+'/students').get(),
        db.collection(base+'/seances').get(),
        db.collection(base+'/tirs').get(),
        db.collection(base+'/matches').get(),
        db.collection(base+'/absences').get()
      ]).then(function(res){
        function toList(snap){ return snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); }
        return Object.assign({}, c, {
          teams: toList(res[0]),
          students: toList(res[1]),
          seances: toList(res[2]),
          tirs: toList(res[3]),
          matches: toList(res[4]),
          absences: toList(res[5])
        });
      });
    }));
  }).then(function(classesFull){
    var backup = {
      app: 'TirScore',
      exportedAt: new Date().toISOString(),
      config: state.config,
      classes: classesFull
    };
    var json = JSON.stringify(backup, null, 2);
    return getDownloads().then(function(d){
      var date = new Date().toISOString().slice(0,10);
      return d.save({filename:'tirscore-sauvegarde-'+date+'.json', data: json});
    });
  }).then(function(){
    flash('Sauvegarde téléchargée.');
  }).catch(function(e){
    console.error(e);
    flash('Erreur lors de la sauvegarde.', 'error');
  });
}

function importJsonBackup(file){
  if (!file || !state.db) return;
  var reader = new FileReader();
  reader.onload = function(){
    var backup;
    try{ backup = JSON.parse(reader.result); }
    catch(e){ flash('Fichier JSON invalide.', 'error'); return; }
    restoreBackup(backup);
  };
  reader.onerror = function(){ flash('Impossible de lire le fichier.', 'error'); };
  reader.readAsText(file);
}

function restoreBackup(backup){
  if (!backup || !Array.isArray(backup.classes)){ flash('Format de sauvegarde non reconnu.', 'error'); return; }
  if (!confirm('Restaurer cette sauvegarde ? Les classes qu\'elle contient seront ajoutées, et les données existantes portant les mêmes identifiants seront écrasées.')) return;
  var db = state.db;
  var writes = [];
  backup.classes.forEach(function(c){
    var classId = c.id;
    if (!classId) return;
    writes.push(db.doc('classes/'+classId).set({name:c.name, createdAt:c.createdAt||Date.now()}));
    ['teams','students','seances','tirs','matches','absences'].forEach(function(col){
      (c[col]||[]).forEach(function(item){
        if (!item.id) return;
        var data = Object.assign({}, item);
        delete data.id;
        writes.push(db.doc('classes/'+classId+'/'+col+'/'+item.id).set(data));
      });
    });
  });
  Promise.all(writes).then(function(){
    flash('Sauvegarde restaurée.');
    var input = document.getElementById('backup-file-input');
    if (input) input.value = '';
  }).catch(function(e){
    console.error(e);
    flash('Erreur pendant la restauration.', 'error');
  });
}
